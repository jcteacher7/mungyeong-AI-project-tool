<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>공간과 시간으로 읽는 우리 지역: Tuning in</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;600;700&display=swap">
<style>

:root{
  --bg:#FBF7EF; --surface:#FFFFFA; --sunk:#F2ECE0; --ink:#2B2620; --muted:#6B6255; --line:#E3DBCB;
  --focus:#E8B23A; --onink:#FBF7EF; --basketA:#2F6FB0; --basketB:#8E4A7C; --live:#2E7D6B;
  --radius:14px;
  --f-head:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E1B17; --surface:#2A2621; --sunk:#24201C; --ink:#F3EEE4; --muted:#B8AE9E; --line:#3E372F;
    --focus:#F0C050; --onink:#1E1B17; --basketA:#6FA3DD; --basketB:#C58AB6; --live:#6FBFA6; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1E1B17; --surface:#2A2621; --sunk:#24201C; --ink:#F3EEE4; --muted:#B8AE9E; --line:#3E372F;
  --focus:#F0C050; --onink:#1E1B17; --basketA:#6FA3DD; --basketB:#C58AB6; --live:#6FBFA6; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:17px; line-height:1.55; padding-inline:16px; padding-block:0 48px}
.wrap{max-width:1080px; margin-inline:auto}
h1,h2,h3{font-family:var(--f-head); font-weight:400; margin:0; text-wrap:balance; line-height:1.25}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px}

.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); border-bottom:1px solid var(--line); margin-inline:-16px; padding:10px 16px}
.top-row{max-width:1080px; margin-inline:auto; display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.brand{font-family:var(--f-head); font-size:22px}
.group-btn{border:2px solid var(--ink); background:transparent; border-radius:999px; padding:4px 14px; font-weight:700; font-size:15px}
.sync{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); margin-left:auto}
.dot{width:9px; height:9px; border-radius:50%; background:var(--muted); flex:none}
.sync.on .dot{background:var(--live)}
.tabs{max-width:1080px; margin:10px auto 0; display:flex; gap:8px; flex-wrap:wrap}
.tab{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 14px; font-size:15px; color:var(--muted)}
.tab[aria-current="step"]{background:var(--ink); color:var(--onink); border-color:var(--ink); font-weight:700}
.tab b{font-variant-numeric:tabular-nums; margin-right:4px}

main{padding-top:20px; display:flex; flex-direction:column; gap:18px}
.lead{font-family:var(--f-head); font-size:28px}
.hint{color:var(--muted); font-size:15px}
.statusline{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.count{font-weight:700; font-variant-numeric:tabular-nums; background:var(--sunk); border-radius:999px; padding:4px 12px; font-size:15px}
.banner{background:var(--sunk); border-left:5px solid var(--focus); border-radius:10px; padding:10px 14px; font-size:15px; color:var(--muted)}

.btn{border:0; background:var(--ink); color:var(--onink); border-radius:12px; padding:12px 20px; font-weight:700; font-size:16px}
.btn:disabled{opacity:.35; cursor:not-allowed}
.btn.ghost{background:transparent; color:var(--ink); border:2px solid var(--line)}
.btn.small{padding:7px 12px; font-size:14px; border-radius:10px}
.actions{display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap}

.picker{background:var(--surface); border:2px solid var(--focus); border-radius:var(--radius); padding:16px 18px; display:flex; flex-direction:column; gap:12px}
.picker .lead{font-size:24px}
.picker-grid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; width:100%}
.picker-grid button{border:2px solid var(--line); background:var(--bg); border-radius:var(--radius); padding:12px 8px; font-family:var(--f-head); font-size:24px}
.picker-grid button:hover{border-color:var(--ink)}
@media (max-width:480px){.picker-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

.photos{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px}
@media (max-width:760px){.photos{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:480px){.photos{grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px}}
.card{position:relative; padding:0; border:4px solid transparent; border-radius:var(--radius); background:var(--surface); overflow:hidden; aspect-ratio:4/3; max-width:100%; box-shadow:0 1px 0 var(--line)}
.card img{display:block; width:100%; height:100%; object-fit:cover}
.card.sel{border-color:var(--focus); transform:translateY(-3px); box-shadow:0 8px 18px rgba(0,0,0,.18)}
.card.paired{border-color:var(--pc)}
.card .badge{position:absolute; left:6px; top:6px}
.badge{display:inline-block; background:var(--pc,var(--ink)); color:#fff; font-weight:700; font-size:13px; border-radius:999px; padding:2px 10px}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s, box-shadow .15s, border-color .15s}}

.pair-list{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px}
.pair-card{background:var(--surface); border:1px solid var(--line); border-top:5px solid var(--pc); border-radius:var(--radius); padding:14px; display:flex; flex-direction:column; gap:10px}
.duo{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.duo img{width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:10px; display:block}
.pair-card label{font-weight:700}
textarea,input[type=text]{width:100%; font:inherit; color:var(--ink); background:var(--bg); border:2px solid var(--line); border-radius:10px; padding:10px 12px; resize:vertical}
textarea:focus,input[type=text]:focus{border-color:var(--ink); outline:none}

.tray{background:var(--sunk); border-radius:var(--radius); padding:14px; display:flex; flex-direction:column; gap:10px}
.tray h3,.basket h3{font-size:22px}
.baskets{display:grid; grid-template-columns:1fr 1fr; gap:14px}
@media (max-width:700px){.baskets{grid-template-columns:1fr}}
.basket{background:var(--surface); border:2px solid var(--bc); border-radius:var(--radius); padding:14px; display:flex; flex-direction:column; gap:10px; min-height:180px}
.basket .tag{color:var(--bc); font-weight:700}
.chips{display:flex; flex-direction:column; gap:8px}
.chip{display:grid; grid-template-columns:120px 1fr; gap:10px; align-items:center; background:var(--bg); border:1px solid var(--line); border-left:5px solid var(--pc); border-radius:10px; padding:8px}
.chip .mini{display:grid; grid-template-columns:1fr 1fr; gap:4px}
.chip .mini img{width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:6px; display:block}
.chip .body{display:flex; flex-direction:column; gap:6px; min-width:0}
.chip .reason{font-size:15px; overflow-wrap:anywhere}
.chip .reason.empty{color:var(--muted)}
.chip .moves{display:flex; gap:6px; flex-wrap:wrap}
.to-A{background:var(--basketA)!important; color:#fff!important}
.to-B{background:var(--basketB)!important; color:#fff!important}
.empty-note{color:var(--muted); font-size:15px}

.present{display:flex; flex-direction:column; gap:20px}
.present-head{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
.present-head h2{font-size:38px}
.gtabs{display:flex; gap:8px; flex-wrap:wrap}
.gtab{border:2px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 16px; font-weight:700; font-size:16px; color:var(--muted)}
.gtab[aria-pressed="true"]{background:var(--ink); color:var(--onink); border-color:var(--ink)}
.gtab .mark{color:var(--live); margin-left:6px}
.gblock{display:flex; flex-direction:column; gap:12px}
.gblock > h3{font-size:26px}
.group-sec{border-radius:var(--radius); background:var(--surface); border:2px solid var(--bc,var(--line)); padding:16px; display:flex; flex-direction:column; gap:12px}
.group-sec .tag{color:var(--bc,var(--muted)); font-weight:700; font-size:15px}
.group-sec h4{font-family:var(--f-head); font-weight:400; font-size:28px; margin:0}
.show-list{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px}
.show-item{display:flex; flex-direction:column; gap:8px}
.show-item p{font-size:19px; font-weight:600}
.show-item p.empty{color:var(--muted); font-weight:400}

.foot{max-width:1080px; margin:36px auto 0; display:flex; justify-content:flex-end}
.link-btn{background:none; border:0; color:var(--muted); text-decoration:underline; font-size:14px; padding:6px}
.overlay{position:fixed; inset:0; background:rgba(20,16,12,.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:20}
.panel{background:var(--surface); border-radius:var(--radius); padding:22px; max-width:540px; width:100%; display:flex; flex-direction:column; gap:14px; max-height:90vh; overflow:auto}
.panel h2{font-size:26px}
.switch{display:flex; gap:10px; align-items:center; font-weight:700}
.switch input{width:22px; height:22px}
.confirm{background:var(--sunk); border-radius:10px; padding:12px; display:flex; flex-direction:column; gap:10px}
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--onink); padding:10px 16px; border-radius:12px; font-size:15px; max-width:calc(100% - 32px); z-index:30}
.others{display:flex; flex-direction:column; gap:4px; border-top:1px dashed var(--line); padding-top:8px}
.others p{font-size:15px; color:var(--muted); overflow-wrap:anywhere}
.others b{color:var(--ink); font-weight:700; margin-right:4px}

/* 수업 시작 화면 */
.sess-list{display:flex; flex-direction:column; gap:8px}
.sess-row{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
  background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 16px; text-align:left; width:100%}
.sess-row:hover{border-color:var(--ink)}
.sess-name{font-weight:700}
.sess-meta{color:var(--muted); font-size:14px}
.sess-meta code, .picker code{background:var(--sunk); border-radius:6px; padding:2px 8px; font-family:var(--f-head); letter-spacing:2px}
.sess-card{background:var(--surface); border:2px solid var(--focus); border-radius:var(--radius); padding:22px; display:flex; flex-direction:column; gap:16px}
.code-big{font-family:var(--f-head); font-size:84px; letter-spacing:12px; text-align:center; color:var(--ink);
  background:var(--sunk); border-radius:var(--radius); padding:12px 8px; line-height:1.1}
.qr-wrap{display:flex; gap:20px; align-items:center; flex-wrap:wrap}
.qr{background:#FFFFFF; padding:10px; border-radius:12px; border:1px solid var(--line); line-height:0; min-width:120px; min-height:120px;
  display:flex; align-items:center; justify-content:center}
.qr-side{flex:1; min-width:220px; display:flex; flex-direction:column; gap:8px}
.url-line{font-size:15px; overflow-wrap:anywhere; background:var(--sunk); border-radius:8px; padding:8px 10px}
@media (max-width:480px){.code-big{font-size:56px; letter-spacing:8px}}

@media print{
  .top,.foot,.overlay,.toast,.present-head .btn,.gtabs{display:none!important}
  body{background:#fff; color:#000; padding:0}
  .group-sec{break-inside:avoid; border-color:#999}
  .show-item p{font-size:14pt}
  .gblock>h3{font-size:18pt}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <span class="brand">공간과 시간으로 읽는 우리 지역</span>
    <button class="group-btn" id="groupBtn" data-action="change-group" type="button">모둠 고르기</button>
    <span class="sync" id="sync"><span class="dot"></span><span id="syncText">연결 중…</span></span>
  </div>
  <nav class="tabs" id="tabs" aria-label="활동 단계"></nav>
</header>

<div class="wrap">
  <main id="main"></main>
  <div class="foot"><button class="link-btn" type="button" data-action="open-teacher">선생님 설정</button></div>
</div>

<div class="overlay" id="teacher" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="teacherTitle">
    <h2 id="teacherTitle">선생님 설정</h2>
    <label class="switch"><input type="checkbox" id="prepaired"> 짝을 미리 지어서 주기</label>
    <p class="hint">켜면 모든 모둠이 짝 짓기를 건너뛰고, 정해 둔 6쌍으로 바로 이유 쓰기부터 해요.</p>
    <div class="confirm" id="modeConfirm" hidden>
      <p>설정을 바꾸면 <b>모든 모둠</b>이 지금까지 적은 짝과 이유가 지워져요.</p>
      <div class="actions"><button class="btn small ghost" type="button" data-action="cancel-mode">그대로 두기</button><button class="btn small" type="button" data-action="confirm-mode">바꾸기</button></div>
    </div>
    <button class="btn ghost" type="button" data-action="show-session">수업 코드 · QR 다시 보기</button>
    <button class="btn ghost" type="button" data-action="reset">이 수업 기록 지우기</button>
    <div class="confirm" id="resetConfirm" hidden>
      <p><b>지금 수업</b>의 네 모둠 기록이 모두 지워져요. 되돌릴 수 없어요. (다른 수업 기록은 그대로입니다)</p>
      <div class="actions"><button class="btn small ghost" type="button" data-action="cancel-reset">취소</button><button class="btn small" type="button" data-action="confirm-reset">지우기</button></div>
    </div>
    <p class="hint" id="modeNote"></p>
    <p class="hint">지금 사진은 예시 그림이에요. 실제 사진 12장(6쌍)으로 바꿔 넣을 수 있습니다.</p>
    <div class="actions"><button class="btn" type="button" data-action="close-teacher">닫기</button></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="config.js"></script>
<script>
(function(){
"use strict";
const W=400, H=300;
function lin(c,y0,y1,a,b){const g=c.createLinearGradient(0,y0,0,y1);g.addColorStop(0,a);g.addColorStop(1,b);return g;}
function rect(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h);}
function poly(c,pts,col){c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);c.closePath();c.fillStyle=col;c.fill();}
function dot(c,x,y,r,col){c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fillStyle=col;c.fill();}
function sky(c,a,b){c.fillStyle=lin(c,0,H,a||'#9FD3EA',b||'#E8F5F9');c.fillRect(0,0,W,H);}
function sun(c,x,y){dot(c,x,y,20,'#F7CF4A');}
function cloud(c,x,y,s){s=s||1;const k='rgba(255,255,255,.92)';dot(c,x,y,12*s,k);dot(c,x+15*s,y-7*s,15*s,k);dot(c,x+31*s,y,12*s,k);rect(c,x,y,31*s,12*s,k);}
function ridge(c,pts,col){poly(c,[[0,H]].concat(pts,[[W,H]]),col);}
function tree(c,x,y,s,col){s=s||1;rect(c,x-2.5*s,y-12*s,5*s,12*s,'#7A5230');dot(c,x,y-21*s,11*s,col||'#3E8A4F');}
function pine(c,x,y,s){s=s||1;rect(c,x-2*s,y-8*s,4*s,8*s,'#6B4A2B');poly(c,[[x,y-36*s],[x-12*s,y-8*s],[x+12*s,y-8*s]],'#2F6B47');}
function person(c,x,y,s,col){s=s||1;rect(c,x-4*s,y-12*s,3*s,12*s,'#4A4038');rect(c,x+1*s,y-12*s,3*s,12*s,'#4A4038');rect(c,x-5*s,y-26*s,10*s,14*s,col);dot(c,x,y-31*s,5*s,'#EBC39E');}
function bent(c,x,y,s,col){s=s||1;rect(c,x-4*s,y-12*s,3*s,12*s,'#4A4038');rect(c,x+1*s,y-12*s,3*s,12*s,'#4A4038');poly(c,[[x-5*s,y-12*s],[x+5*s,y-12*s],[x+14*s,y-20*s],[x+8*s,y-26*s]],col);dot(c,x+15*s,y-25*s,4.5*s,'#EBC39E');poly(c,[[x+8*s,y-28*s],[x+15*s,y-35*s],[x+22*s,y-27*s]],'#CDB57A');}
function house(c,x,y,s,wall,roof){s=s||1;rect(c,x-18*s,y-20*s,36*s,20*s,wall);poly(c,[[x-23*s,y-20*s],[x,y-36*s],[x+23*s,y-20*s]],roof);rect(c,x-12*s,y-14*s,8*s,7*s,'#CFE6F2');rect(c,x+4*s,y-14*s,7*s,14*s,'#8A6A4A');}
function thatch(c,x,y,s){s=s||1;rect(c,x-20*s,y-18*s,40*s,18*s,'#E8DAB9');rect(c,x-5*s,y-14*s,10*s,14*s,'#6E4E2E');c.beginPath();c.ellipse(x,y-18*s,27*s,15*s,0,Math.PI,2*Math.PI);c.closePath();c.fillStyle='#C8A35B';c.fill();c.strokeStyle='#9C7A3C';c.lineWidth=1.2;c.beginPath();c.ellipse(x,y-18*s,19*s,10*s,0,Math.PI,2*Math.PI);c.stroke();rect(c,x-27*s,y-19*s,54*s,3*s,'#B08D48');}
function apartment(c,x,y,w,h,col){rect(c,x,y-h,w,h,col);rect(c,x,y-h,w,4,'#B9B2A6');for(let yy=y-h+12;yy<y-10;yy+=13)for(let xx=x+8;xx<x+w-8;xx+=13)rect(c,xx,yy,7,7,'#CFE2F0');}
function boat(c,x,y,s,col){s=s||1;poly(c,[[x-30*s,y-10*s],[x+32*s,y-10*s],[x+24*s,y],[x-24*s,y]],col);rect(c,x-6*s,y-24*s,18*s,14*s,'#F3EFE6');rect(c,x-2*s,y-20*s,6*s,5*s,'#7FB6D6');c.strokeStyle='#4A4038';c.lineWidth=2*s;c.beginPath();c.moveTo(x-16*s,y-10*s);c.lineTo(x-16*s,y-40*s);c.stroke();poly(c,[[x-16*s,y-40*s],[x-4*s,y-36*s],[x-16*s,y-32*s]],'#E8B23A');}
function sea(c,y0){c.fillStyle=lin(c,y0,H,'#5AA7D0','#2E6F9E');c.fillRect(0,y0,W,H-y0);c.strokeStyle='rgba(255,255,255,.5)';c.lineWidth=2;for(let i=0;i<6;i++){const y=y0+14+i*24;for(let x=-10+(i%2)*20;x<W;x+=44){c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+10,y-5,x+20,y);c.stroke();}}}
function gull(c,x,y){c.strokeStyle='#4A4A4A';c.lineWidth=2;c.beginPath();c.moveTo(x-8,y);c.quadraticCurveTo(x-4,y-6,x,y);c.quadraticCurveTo(x+4,y-6,x+8,y);c.stroke();}

function rng(seed){let s=seed*2654435761%2147483647;return()=>((s=s*16807%2147483647)-1)/2147483646;}
function shuffleSeeded(arr,seed){const r=rng(seed),a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function seededOrder(g){return shuffleSeeded(PHOTOS.map(p=>p.id),g*7+3);}
function presetPairs(g){
  const sets=shuffleSeeded([...new Set(PHOTOS.map(p=>p.set))],g*13+5), out={};
  sets.forEach((s,i)=>{const ids=shuffleSeeded(PHOTOS.filter(p=>p.set===s).map(p=>p.id),g*3+i);
    out['p'+(i+1)]={a:ids[0],b:ids[1],color:i};});
  return out;
}

const SEP='~', IDX='__sessions';
function sk(key){return SESSION+SEP+key;}                 /* 우리 수업 칸 이름 */
function unsk(key){var p=SESSION+SEP;return key.indexOf(p)===0?key.slice(p.length):null;}
function newCode(){
  var A='ACDEFGHJKLMNPQRTUVWXY34679', s='';       /* 헷갈리는 글자(B,I,O,S,Z,0,1,2,5,8) 제외 */
  for(var i=0;i<4;i++)s+=A[Math.floor(Math.random()*A.length)];
  return s;
}
function sessionUrl(code){return location.origin+location.pathname+'?c='+(code||SESSION);}

function api(path,opts){
  opts=opts||{};
  const h=Object.assign({'apikey':CFG.key,'Authorization':'Bearer '+CFG.key,'Content-Type':'application/json'},opts.headers||{});
  return fetch(CFG.url.replace(/\/$/,'')+'/rest/v1/'+path,Object.assign({},opts,{headers:h}));
}
async function pull(all){
  const filter=all?'':(group?'&group_id=in.(0,'+group+')':'&group_id=eq.0');
  const r=await api('entries?select=group_id,key,value&key=like.'+encodeURIComponent(SESSION+SEP)+'*'+filter);
  if(!r.ok)throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,120));
  const rows=await r.json(), byG={};
  rows.forEach(x=>{const k=unsk(x.key);if(k===null)return;(byG[x.group_id]=byG[x.group_id]||{})[k]=x.value;});
  return byG;
}
/* 지난 수업 목록 */
async function pullSessions(){
  const r=await api('entries?select=key,value&group_id=eq.0&key=like.'+IDX+SEP+'*&order=key');
  if(!r.ok)return [];
  const rows=await r.json();
  return rows.map(function(x){
    var v=x.value||{};
    return {code:x.key.slice((IDX+SEP).length),name:v.name||'',at:v.at||0};
  }).sort(function(a,b){return b.at-a.at;});
}
async function createSession(name){
  var code=newCode();
  for(var i=0;i<5;i++){ if(!sessionList.some(function(s){return s.code===code;}))break; code=newCode(); }
  await putRaw(0,IDX+SEP+code,{name:name||'',at:Date.now()});
  SESSION=code;sessionName=name||'';justCreated=true;
  try{localStorage.setItem('tuning-in-session',code);}catch(e){}
  group=null;E={};ALLE={};
  Object.keys(SRV).forEach(function(k){delete SRV[k];});
  Object.keys(LOCALW).forEach(function(k){delete LOCALW[k];});
  history.replaceState(null,'',sessionUrl(code));
  return code;
}
function enterSession(code,name){
  SESSION=String(code).toUpperCase();sessionName=name||'';justCreated=false;
  try{localStorage.setItem('tuning-in-session',SESSION);}catch(e){}
  group=null;E={};ALLE={};
  Object.keys(SRV).forEach(function(k){delete SRV[k];});
  Object.keys(LOCALW).forEach(function(k){delete LOCALW[k];});
  history.replaceState(null,'',sessionUrl(SESSION));
}
async function put(gid,key,value){ return putRaw(gid,sk(key),value); }
async function putRaw(gid,key,value){
  const r=await api('entries?on_conflict=group_id,key',{method:'POST',
    headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},
    body:JSON.stringify([{group_id:gid,key:key,value:value===undefined?null:value,updated_at:new Date().toISOString()}])});
  if(!r.ok)throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,120));
}
function localSave(){try{localStorage.setItem(LOCAL_KEY,JSON.stringify({g:group,E:E}));}catch(e){}}

/* 값 쓰기: 화면에 먼저 반영하고, 서버에는 모아서 보냄 */
const sendT={};
function setVal(key,value,gid){
  const g=gid===undefined?group:gid;
  if(g===group)E[key]=value; else (ALLE[g]=ALLE[g]||{})[key]=value;
  render();
  if(!connected){localSave();return;}
  LOCALW[g+'|'+key]=value;
  clearTimeout(sendT[g+'|'+key]);
  sendT[g+'|'+key]=setTimeout(()=>{
    const v=LOCALW[g+'|'+key];
    put(g,key,v).then(()=>{SRV[g+'|'+key]=v;delete LOCALW[g+'|'+key];})
      .catch(()=>toast('저장하지 못했어요. 인터넷을 확인해 주세요.'));
  },450);
}
function setValSoon(key,value){setVal(key,value);}

/* 서버에서 받은 값을 내 값과 합치기 */
function absorb(byG){
  Object.keys(byG).forEach(function(gs){
    var g=+gs, rows=byG[g], target=(g===group)?E:(ALLE[g]=ALLE[g]||{});
    Object.keys(rows).forEach(function(key){
      var k=g+'|'+key;
      if(LOCALW[k]===undefined)target[key]=rows[key];   /* 내가 방금 쓴 값은 지킴 */
      SRV[k]=rows[key];
    });
    Object.keys(target).forEach(function(key){
      if(!(key in rows)&&LOCALW[g+'|'+key]===undefined)delete target[key];
    });
  });
}

let pollT=null, pollBusy=false;
function stableSig(){
  var parts=[];
  [['E',E],['A',ALLE]].forEach(function(pair){
    var o=pair[1];
    Object.keys(o).sort().forEach(function(k){
      var v=o[k];
      if(v&&typeof v==='object'&&!Array.isArray(v)){
        parts.push(pair[0]+'|'+k+'='+Object.keys(v).sort().map(function(kk){return kk+':'+JSON.stringify(v[kk]);}).join(','));
      }else parts.push(pair[0]+'|'+k+'='+JSON.stringify(v));
    });
  });
  return parts.join(';');
}
var lastSig=null;
async function poll(){
  if(!connected||pollBusy||document.hidden||!SESSION||!group)return;
  pollBusy=true;
  try{
    const byG=await pull(state.step===4);
    absorb(byG);
    setSync(true,'모둠끼리 실시간 공유 중');
    var sig=stableSig();
    if(sig!==lastSig){lastSig=sig;render();}   /* 바뀐 게 없으면 화면을 다시 그리지 않음 */
  }catch(e){ setSync(false,'연결이 잠깐 끊겼어요'); }
  finally{ pollBusy=false; }
}
function startPolling(){clearInterval(pollT);pollT=setInterval(poll,1300);poll();}

async function connect(){
  if(!online){setSync(false,'이 기기에만 저장');localLoad();render();return;}
  setSync(false,'연결 중…');
  try{
    sessionList=await pullSessions();
    connected=true;
    if(SESSION){
      var found=sessionList.filter(function(x){return x.code===SESSION;})[0];
      if(found)sessionName=found.name;
      absorb(await pull(false));
      await ensureSeed();
      announce();
      setSync(true,'모둠끼리 실시간 공유 중');
    }else setSync(true,'연결됨');
    startPolling();
  }catch(e){
    connected=false;setupError=String(e.message||e);
    setSync(false,'연결 안 됨 — 이 기기에만 저장');
    localLoad();
  }
  render();
}
async function ensureSeed(){
  if(!connected||!group)return;
  if(!E['order'])await put(group,'order',seededOrder(group)).then(()=>{E['order']=seededOrder(group);}).catch(()=>{});
  if(prepaired()&&!Object.keys(pairsRaw()).length){
    const pp=presetPairs(group);
    for(const pid in pp){ await put(group,'pair:'+pid,pp[pid]).catch(()=>{}); E['pair:'+pid]=pp[pid]; }
  }
}
function announce(){
  if(!connected||!group||!myName)return;
  setVal('member:'+deviceId,{name:myName,at:Date.now()});
}

/* ---------- 상태 읽기 ---------- */
function prepaired(){ const v=(ALLE[0]||{})['prepaired']; return !!v; }
function order(){ const o=E['order']; return (Array.isArray(o)&&o.length===PHOTOS.length)?o:seededOrder(group||1); }
function pairsRaw(){ const out={}; Object.keys(E).forEach(k=>{if(k.indexOf('pair:')===0&&E[k])out[k.slice(5)]=E[k];}); return out; }
/* 이유는 사람(기기)마다 자기 칸에 씀 -> 서로 덮어쓸 일이 없음 */
function contribsOf(src,pid){
  var out=[];
  Object.keys(src).forEach(function(k){
    if(k.indexOf('r:'+pid+':')!==0)return;
    var dev=k.slice(('r:'+pid+':').length), txt=(src[k]||'')+'';
    if(!txt.trim())return;
    var m=src['member:'+dev];
    out.push({dev:dev,name:(m&&m.name)?m.name:'',text:txt.trim()});
  });
  out.sort(function(a,b){return a.dev<b.dev?-1:1;});
  return out;
}
function joinContribs(cs){return cs.map(function(c){return c.text;}).join(' / ');}
function pairsOfGroup(g){
  var src=(g===group)?E:(ALLE[g]||{}), raw={};
  Object.keys(src).forEach(function(k){if(k.indexOf('pair:')===0&&src[k])raw[k.slice(5)]=src[k];});
  return Object.keys(raw).map(function(pid){
    var cs=contribsOf(src,pid);
    return {id:pid,a:raw[pid].a,b:raw[pid].b,color:raw[pid].color,
      contribs:cs,reason:joinContribs(cs),basket:src['basket:'+pid]||null};
  }).sort(function(x,y){return x.color-y.color;});
}
function pairs(){return pairsOfGroup(group);}
function nameOf(g,k){const src=(g===group)?E:(ALLE[g]||{});return src['name:'+k]||'';}
function members(){
  const now=Date.now();
  return Object.keys(E).filter(k=>k.indexOf('member:')===0).map(k=>E[k])
    .filter(m=>m&&m.name&&now-(m.at||0)<3*60*60*1000).map(m=>m.name.trim()).filter(Boolean);
}

function drawQR(){
  var box=$('qrbox');if(!box)return;
  var url=sessionUrl();
  function make(){
    try{
      var q=window.qrcode(0,'M');q.addData(url);q.make();
      box.innerHTML=q.createSvgTag({cellSize:5,margin:2,scalable:true});
      var svg=box.querySelector('svg');if(svg){svg.setAttribute('width','200');svg.setAttribute('height','200');}
    }catch(e){box.innerHTML='<p class="hint">QR을 만들지 못했어요. 아래 주소를 쓰세요.</p>';}
  }
  if(window.qrcode)return make();
  if(document.getElementById('qrlib'))return;
  var sc=document.createElement('script');sc.id='qrlib';
  sc.src='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
  sc.onload=make;
  sc.onerror=function(){box.innerHTML='<p class="hint">QR을 불러오지 못했어요. 아래 주소를 쓰세요.</p>';};
  document.head.appendChild(sc);
}

function nextColor(){var used={};pairs().forEach(function(p){used[p.color]=1;});for(var i=0;i<6;i++)if(!used[i])return i;return 0;}
function tapPhoto(id){
  var ps=pairs(), p=null;
  ps.forEach(function(x){if(x.a===id||x.b===id)p=x;});
  if(p){
    if(p.reason.trim()&&state.pendingUnpair!==p.id){state.pendingUnpair=p.id;toast('이유를 적은 짝이에요. 한 번 더 누르면 짝이 풀려요.');return;}
    state.pendingUnpair=null;state.sel=null;
    setVal('pair:'+p.id,null);setVal('basket:'+p.id,null);
    Object.keys(E).forEach(function(k){if(k.indexOf('r:'+p.id+':')===0)setVal(k,'');});
    return;
  }
  state.pendingUnpair=null;
  if(state.sel===null){state.sel=id;render();}
  else if(state.sel===id){state.sel=null;render();}
  else{
    var a=state.sel;state.sel=null;
    var pid='p'+Date.now().toString(36)+Math.floor(Math.random()*1000).toString(36);
    setVal('pair:'+pid,{a:a,b:id,color:nextColor()});
    if(pairs().length===6)toast('짝 6개를 다 지었어요!');
  }
}
async function joinGroup(g){
  group=g;try{localStorage.setItem('tuning-in-group',String(g));}catch(e){}
  E={};ALLE[0]=ALLE[0]||{};
  state.step=1;
  if(!connected){localLoad();if(!E['order'])E['order']=seededOrder(g);if(prepaired()&&!Object.keys(pairsRaw()).length)E=Object.assign(E,Object.keys(presetPairs(g)).reduce(function(o,pid){o['pair:'+pid]=presetPairs(g)[pid];return o;},{}));localSave();render();return;}
  render();
  try{ absorb(await pull(false)); await ensureSeed(); announce(); }catch(e){}
  render();
}
function selectUrl(){
  var el=$('urlLine');if(!el)return;
  try{var r=document.createRange();r.selectNodeContents(el);var sel=getSelection();sel.removeAllRanges();sel.addRange(r);
    toast('주소가 선택됐어요. Ctrl+C로 복사하세요.');}catch(e){}
}
function openTeacher(){
  $('prepaired').checked=prepaired();$('modeConfirm').hidden=true;$('resetConfirm').hidden=true;
  $('modeNote').textContent=connected?'설정과 기록은 모든 기기에 함께 적용돼요.':'지금은 공유가 꺼져 있어 이 기기에만 적용돼요.';
  $('teacher').hidden=false;$('prepaired').focus();
}
function closeTeacher(){$('teacher').hidden=true;}
async function resetAll(pre){
  if(connected){
    try{
      var r=await api('entries?group_id=gt.0&key=like.'+encodeURIComponent(SESSION+SEP)+'*',{method:'DELETE',headers:{'Prefer':'return=minimal'}});
      if(!r.ok)throw new Error('HTTP '+r.status);
      await put(0,'prepaired',!!pre);
      ALLE={0:{prepaired:!!pre}};E={};
      Object.keys(SRV).forEach(function(k){delete SRV[k];});
      Object.keys(LOCALW).forEach(function(k){delete LOCALW[k];});
      if(group)await ensureSeed();
      announce();
    }catch(e){toast('초기화하지 못했어요. 잠시 뒤 다시 해 보세요.');return false;}
  }else{
    ALLE[0]={prepaired:!!pre};E={};
    if(group){E['order']=seededOrder(group);
      if(pre){var pp=presetPairs(group);for(var pid in pp)E['pair:'+pid]=pp[pid];}}
    localSave();
  }
  state.step=1;render();return true;
}

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-action]');if(!t||t.disabled)return;
  var a=t.dataset.action;
  if(a==='new-session'){
    var ni=$('sessName'), nm=ni?ni.value.trim():'';
    t.disabled=true;
    createSession(nm).then(function(){
      return pullSessions().then(function(l){sessionList=l;});
    }).then(function(){render();toast('수업이 시작됐어요.');})
     .catch(function(){t.disabled=false;toast('수업을 만들지 못했어요. 잠시 뒤 다시 해 보세요.');});
    return;
  }
  if(a==='join-code'){
    var ci=$('codeInput'), code=ci?ci.value.trim().toUpperCase():'';
    if(!code){toast('수업 코드를 적어 주세요.');if(ci)ci.focus();return;}
    var known=sessionList.filter(function(x){return x.code===code;})[0];
    if(!known){toast('그런 수업 코드가 없어요. 다시 확인해 주세요.');return;}
    enterSession(code,known.name);connect();return;
  }
  if(a==='open-session'){
    var c=t.dataset.code, k=sessionList.filter(function(x){return x.code===c;})[0];
    enterSession(c,k?k.name:'');connect();return;
  }
  if(a==='leave-session'){
    SESSION='';sessionName='';justCreated=false;group=null;E={};ALLE={};
    try{localStorage.removeItem('tuning-in-session');localStorage.removeItem('tuning-in-group');}catch(err){}
    history.replaceState(null,'',location.origin+location.pathname);
    connect();return;
  }
  if(a==='go-join'){justCreated=false;render();return;}
  if(a==='show-session'){justCreated=true;closeTeacher();render();return;}
  if(a==='copy-url'){
    var u=sessionUrl();
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(u).then(function(){toast('주소를 복사했어요.');})
        .catch(function(){selectUrl();});
    }else selectUrl();
    return;
  }
  if(a==='print'){window.print();return;}
  if(a==='pick-group'){
    var ni=$('nameInput'), v=ni?ni.value.trim():myName;
    if(!v){toast('이름을 먼저 적어 주세요.');if(ni)ni.focus();return;}
    myName=v.slice(0,12);try{localStorage.setItem('tuning-in-name',myName);}catch(err){}
    joinGroup(+t.dataset.group);
  }
  else if(a==='change-group'){group=null;E={};try{localStorage.removeItem('tuning-in-group');}catch(err){}render();}
  else if(a==='step'){state.sel=null;state.step=+t.dataset.step;render();window.scrollTo({top:0});if(state.step===4)poll();}
  else if(a==='photo')tapPhoto(t.dataset.id);
  else if(a==='basket')setVal('basket:'+t.dataset.pair,t.dataset.b);
  else if(a==='unbasket')setVal('basket:'+t.dataset.pair,null);
  else if(a==='ptab'){state.presentTab=t.dataset.tab;render();}
  else if(a==='fullscreen'){var d=document;if(d.fullscreenElement){if(d.exitFullscreen)d.exitFullscreen().catch(function(){});}else if(d.documentElement.requestFullscreen)d.documentElement.requestFullscreen().catch(function(){toast('이 화면에서는 크게 보기를 쓸 수 없어요.');});else toast('이 화면에서는 크게 보기를 쓸 수 없어요.');}
  else if(a==='open-teacher')openTeacher();
  else if(a==='close-teacher')closeTeacher();
  else if(a==='confirm-mode'){var want=state.pendingMode;state.pendingMode=null;$('modeConfirm').hidden=true;
    resetAll(want).then(function(ok){if(ok){$('prepaired').checked=want;toast(want?'짝을 미리 지어서 주도록 바꿨어요.':'아이들이 직접 짝을 짓도록 바꿨어요.');}});}
  else if(a==='cancel-mode'){state.pendingMode=null;$('prepaired').checked=prepaired();$('modeConfirm').hidden=true;}
  else if(a==='reset')$('resetConfirm').hidden=false;
  else if(a==='cancel-reset')$('resetConfirm').hidden=true;
  else if(a==='confirm-reset'){$('resetConfirm').hidden=true;
    resetAll(prepaired()).then(function(ok){if(ok){closeTeacher();toast('모든 모둠 기록을 지웠어요.');}});}
});
document.addEventListener('change',function(e){
  if(e.target.id==='prepaired'){
    var want=e.target.checked;
    if(want===prepaired())return;
    state.pendingMode=want;$('modeConfirm').hidden=false;
  }
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.dataset.pair&&el.tagName==='TEXTAREA'){
    var pid=el.dataset.pair, key='r:'+pid+':'+deviceId;
    E[key]=el.value;
    if(connected)LOCALW[group+'|'+key]=el.value;
    var n=reasonCount(),c=$('reasonCount'),b=$('toStep3');
    if(c)c.textContent='이유 '+n+' / '+pairs().length;
    if(b)b.disabled=n<pairs().length;
    setValSoon(key,el.value);
  }else if(el.dataset.name){
    var k=el.dataset.name;
    E['name:'+k]=el.value;
    if(connected)LOCALW[group+'|name:'+k]=el.value;
    setValSoon('name:'+k,el.value);
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('teacher').hidden)closeTeacher();});
$('teacher').addEventListener('click',function(e){if(e.target===$('teacher'))closeTeacher();});
document.addEventListener('visibilitychange',function(){if(!document.hidden)poll();});
window.addEventListener('pagehide',function(){if(!connected)localSave();});

render();
connect();
})();

</script>
</body>
</html>
