<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연결 점검</title>
<style>
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#FBF8F1;color:#2B2A27;margin:0;padding:28px 16px}
main{max-width:640px;margin:0 auto}
h1{font-size:26px;color:#24563A;margin:0 0 6px}
p{color:#5C564E;margin:0 0 18px}
ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
li{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid #E5DFD3;border-radius:14px;padding:14px 16px;font-size:18px}
li b{flex:1}
li span{font-weight:800}
.ok{color:#2E7D4F}.no{color:#C0392B}.wait{color:#999}
#sum{margin-top:18px;font-size:18px;font-weight:700;line-height:1.5}
button{margin-top:14px;font-size:17px;padding:10px 18px;border-radius:10px;border:0;background:#24563A;color:#fff}
</style>
</head>
<body>
<main>
<h1>크롬북 연결 점검</h1>
<p>앱이 쓰는 인터넷 주소에 이 크롬북이 닿는지 확인해요. 10초쯤 걸려요. 2초가 넘으면 🐢로 표시돼요.</p>
<ul id="list"></ul>
<div id="sum"></div>
<button onclick="location.reload()">다시 점검하기</button>
</main>
<script>
var T=[
 ['구글 (비교용)','https://www.google.com/favicon.ico'],
 ['앱 페이지 (github.io)','https://jcteacher7.github.io/mungyeong-AI-project-tool/exhibit/icon-192.png'],
 ['저장된 기록 (supabase.co)','https://wigxlmwysuqxiuonucqq.supabase.co/rest/v1/'],
 ['글꼴 (jsdelivr.net)','https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css'],
 ['글꼴 (fonts.googleapis.com)','https://fonts.googleapis.com/css2?family=Gaegu'],
 ['패들렛 (padlet.com)','https://padlet.com/favicon.ico']
];
var list=document.getElementById('list'),res=[];
T.forEach(function(t,i){
 var li=document.createElement('li');li.innerHTML='<b>'+t[0]+'</b><span class="wait">확인 중…</span>';list.appendChild(li);
 var c=new AbortController(),to=setTimeout(function(){c.abort()},10000),t0=performance.now();
 fetch(t[1]+(t[1].indexOf('?')<0?'?':'&')+'t='+Date.now(),{mode:'no-cors',cache:'no-store',signal:c.signal})
  .then(function(){return true},function(){return false})
  .then(function(ok){clearTimeout(to);res[i]=ok;var s=li.querySelector('span');s.className=ok?'ok':'no';var ms=Math.round(performance.now()-t0);s.textContent=ok?(ms>2000?'🐢 느림 '+(ms/1000).toFixed(1)+'초':'✅ '+(ms/1000).toFixed(1)+'초'):'❌ 막힘';if(ok&&ms>2000)s.className='no';done()});
});
function done(){
 if(res.filter(function(x){return x!==undefined}).length<T.length)return;
 var s=document.getElementById('sum');
 if(res.every(Boolean))s.textContent='모두 연결돼요. 앱에서 계속 로딩만 뜨면 새로고침하거나 크롬북을 다시 켜 보세요.';
 else if(!res[2])s.innerHTML='<span class="no">저장된 기록 주소(supabase.co)가 막혀 있어요.</span><br>학교 인터넷 차단 때문일 가능성이 커요. 전산 담당 선생님께 <b>*.supabase.co</b> 허용을 부탁하거나, 휴대폰 핫스팟으로 연결해 보세요.';
 else s.textContent='❌ 표시된 주소가 학교 인터넷에서 막혀 있어요. 전산 담당 선생님께 허용을 부탁해 주세요.';
}
</script>
</body>
</html>
