<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>돌아보는 길</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --mist:#E7ECEA;        /* 안개 낀 아침 들판 */
  --paper:#F7F9F8;       /* 글 쓰는 자리 */
  --ink:#223038;         /* 먹 */
  --soft:#6E8089;        /* 흐린 글씨 */
  --far:#AFC0C4;         /* 먼 능선 */
  --near:#3E5C6B;        /* 가까운 능선 */
  --moss:#6F8F5F;        /* 숲 */
  --lit:#C9913F;         /* 오늘, 불 켜진 자리 */
  --line:#CFD9D6;
  --serif:'Gowun Batang',serif;
  --sans:'IBM Plex Sans KR',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--mist); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.7;
  padding:0 20px 140px;
}
.wrap{max-width:620px;margin:0 auto}
.wide{max-width:980px;margin:0 auto}
[hidden]{display:none!important}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
:focus-visible{outline:2.5px solid var(--near);outline-offset:3px;border-radius:4px}

/* 머리 */
.top{display:flex;align-items:baseline;gap:12px;padding:26px 0 8px}
.top h1{font-family:var(--serif);font-weight:400;font-size:21px;letter-spacing:.06em;margin:0;flex:1}
.top .state{font-size:12px;color:var(--soft)}
.top .state b{font-weight:500;color:var(--near)}

h2{font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.45;margin:0 0 6px;letter-spacing:-.01em}
h3{font-family:var(--serif);font-weight:400;font-size:20px;margin:0}
p{margin:0 0 4px}
.quiet{color:var(--soft);font-size:14.5px}
.rule{height:1px;background:var(--line);border:0;margin:28px 0}

/* 길 */
.trail{margin:30px 0 8px}
.trail svg{display:block;width:100%;height:auto;overflow:visible}
.trail text{font-family:var(--sans);font-size:11px;fill:var(--soft)}
.trail text.now{fill:var(--lit);font-weight:600}
.trail text.done{fill:var(--near)}
@media (prefers-reduced-motion:no-preference){
  .trail circle.fresh{animation:pop .55s cubic-bezier(.2,.9,.3,1.3)}
}
@keyframes pop{from{r:3;opacity:.2}to{r:7;opacity:1}}

/* 오늘 카드 */
.today{background:var(--paper);border-radius:3px;padding:26px 24px;
  box-shadow:0 1px 0 var(--line), 0 14px 32px -24px rgba(34,48,56,.5)}
.today .tag{font-family:var(--serif);font-size:14px;color:var(--lit)}
.today h2{margin-top:2px}
.go{display:inline-flex;align-items:center;gap:10px;margin-top:18px;background:var(--near);color:#fff;
  padding:14px 26px;border-radius:2px;font-weight:500;font-size:16.5px}
.go.quietbtn{background:none;color:var(--near);padding:12px 0;box-shadow:inset 0 -1px 0 var(--near)}
.go[disabled]{background:#C3CDCB;cursor:default}
.saved{background:#fff;border-left:3px solid var(--moss);padding:14px 18px;margin:16px 0;font-size:15.5px}
.saved b{font-family:var(--serif);font-weight:400;color:var(--moss)}

/* 명단 */
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);margin-top:22px}
.pickgrid button{background:var(--paper);padding:18px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:17px;font-family:var(--serif)}
.pickgrid button em{font-style:normal;font-size:11px;color:var(--soft);font-family:var(--sans)}
.pickgrid button:hover{background:#fff;color:var(--near)}
.pickgrid button.done em{color:var(--moss)}
.classpick{display:grid;gap:14px;margin-top:26px}
.classpick button{background:var(--paper);padding:26px;text-align:left;font-family:var(--serif);font-size:24px;
  box-shadow:0 1px 0 var(--line)}
.classpick button span{display:block;font-family:var(--sans);font-size:13px;color:var(--soft);margin-top:4px}
.classpick button:hover{box-shadow:0 1px 0 var(--near)}

/* 문항 */
.ask{margin:34px 0 0}
.ask + .ask{border-top:1px solid var(--line);padding-top:30px;margin-top:30px}
.ask .skill{font-size:12.5px;color:var(--soft);letter-spacing:.04em;margin-bottom:7px}
.ask q{font-family:var(--serif);font-size:21px;line-height:1.55;quotes:none;display:block;margin-bottom:16px}
.scale{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.scale button{background:var(--paper);padding:14px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:7px;
  font-size:13.5px;color:var(--soft)}
.scale button svg{width:58px;height:34px}
.scale button svg path.m{fill:none;stroke:var(--far);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.scale button[aria-pressed=true]{background:#fff;color:var(--ink);font-weight:500}
.scale button[aria-pressed=true] svg path.m{stroke:var(--lit);stroke-width:2.8}
.scale button[aria-pressed=true] svg path.g{fill:rgba(201,145,63,.13)}

textarea{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:2px;padding:16px;
  font-family:var(--serif);font-size:18px;line-height:1.8;color:var(--ink);resize:vertical;min-height:120px}
textarea::placeholder{color:#A8B6B9}
textarea:focus{outline:none;border-color:var(--near);box-shadow:0 0 0 3px rgba(62,92,107,.12)}
textarea.plain{font-family:var(--sans);font-size:15px;min-height:96px;line-height:1.6}

/* 되돌아본 글 */
.entries{margin:4px 0 0;padding:0;list-style:none}
.entries li{padding:16px 0;border-top:1px solid var(--line)}
.entries .st{font-size:12.5px;color:var(--soft);margin-bottom:3px}
.entries .tx{font-family:var(--serif);font-size:17.5px;line-height:1.7}
.entries .tx.ai{margin-top:8px;font-size:16px;color:var(--ink);opacity:.9}
.qtag{display:block;font-family:var(--sans);font-size:12.5px;color:var(--soft);letter-spacing:.04em;margin:0 0 4px}
.marks{display:inline-flex;gap:4px;vertical-align:1px;margin-left:8px}
.mk{width:7px;height:7px;border-radius:50%;background:var(--line);display:inline-block}
.mk.v1{background:#D6DEDB}.mk.v2{background:var(--far)}.mk.v3{background:var(--near)}

.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--soft);margin:2px 0 0}
.legend i{display:inline-block;width:16px;height:2.5px;margin-right:6px;vertical-align:4px;border-radius:2px}

/* 교사 */
.tabs{display:flex;gap:2px;margin:22px 0 0}
.tabs button{padding:10px 18px;font-size:14.5px;color:var(--soft);background:transparent;box-shadow:inset 0 -1px 0 var(--line)}
.tabs button[aria-selected=true]{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--near)}
.tblwrap{overflow-x:auto;margin-top:18px}
table{border-collapse:collapse;font-size:13px;white-space:nowrap;width:100%}
th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:center}
th{font-weight:500;color:var(--soft);font-size:12px}
td.nm{text-align:left;font-family:var(--serif);font-size:15.5px}
td.nm button{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--far)}
.setblock{background:var(--paper);padding:18px;margin-bottom:10px;box-shadow:0 1px 0 var(--line)}
.setblock .lbl{font-size:12.5px;color:var(--soft);margin-bottom:6px}
input.t{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:6px 0;
  font-family:var(--serif);font-size:19px;color:var(--ink)}
input.t:focus{outline:none;border-bottom-color:var(--near)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips button{border:1px solid var(--line);background:var(--paper);padding:7px 14px;font-size:13.5px;color:var(--soft)}
.chips button[aria-pressed=true]{border-color:var(--lit);color:var(--lit);background:#fff;font-weight:500}

.foot{text-align:center;padding:46px 0 0}
.foot button{color:var(--soft);font-size:13px;box-shadow:inset 0 -1px 0 var(--line);padding-bottom:2px}

/* 잠금 */
.top h1{cursor:default;user-select:none;-webkit-user-select:none}
.lock{max-width:300px;margin:60px auto 0;text-align:center}
.lock .dots{text-align:center;font-size:30px;letter-spacing:10px;min-height:44px;margin:14px 0 4px;color:var(--near)}
.lock.wrong .dots{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@media (prefers-reduced-motion:reduce){.lock.wrong .dots{animation:none}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center;margin:16px 0}
.pad button{height:64px;border-radius:12px;background:#fff;border:1.5px solid var(--line);font-size:24px}
.pad button:active{background:var(--paper)}
.tabs .tside{margin-left:auto;box-shadow:none}
.tabs .tside + .tside{margin-left:0}
.msg{background:#fff;border-left:3px solid var(--lit);padding:12px 16px;font-size:14.5px;margin:16px 0}
.msg.bad{border-left-color:#A8524A;color:#7E3B34}

/* 전시용 보기 모드 */
.viewbar{display:none}
body.viewmode .viewbar{display:flex;position:sticky;top:0;z-index:15;justify-content:center;gap:8px;background:#223038;color:#fff;font-size:15px;font-weight:600;padding:7px 12px;margin:0 -20px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body.viewmode .viewbar small{font-weight:400;opacity:.75}
.vq{font-family:var(--serif);font-size:21px;margin:18px 0 4px}
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:14px}
.vcard{background:var(--paper);padding:16px 18px;border-top:3px solid var(--far)}
.vcard .nm{font-size:13px;color:var(--soft);margin-bottom:4px}
.vcard .nt{font-family:var(--serif);font-size:17px;line-height:1.65;white-space:pre-wrap}
.vcard .ai{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:14px;color:#3d4d55;white-space:pre-wrap}
.vcard .ai b{display:block;font-size:12px;color:var(--lit);font-weight:600}
.vcard .lv{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.vcard .lv span{font-size:12px;color:#fff;padding:1px 8px;border-radius:99px}
.vexit{position:fixed;inset:0;background:rgba(20,30,35,.45);display:flex;align-items:center;justify-content:center;z-index:30}
.vexit .box{background:var(--paper);padding:22px 26px;max-width:340px;width:100%;text-align:center}
.vexit input{font-size:24px;letter-spacing:6px;width:140px;text-align:center;padding:6px;border:1px solid var(--line);margin:10px 0}
@media print{
  body{background:#fff;padding:0}
  .noprint{display:none!important}
  .today,.setblock{box-shadow:none}
  h2{font-size:24px}
}
</style>
</head>
<body>

<div class="viewbar noprint" id="viewbar">👀 보기 모드 <small>· 아이들이 남긴 성찰을 둘러볼 수 있어요 (고칠 수 없어요)</small></div>
<div class="wrap noprint"><div class="top">
  <h1 id="title">돌아보는 길</h1>
  <span class="state" id="state"></span>
</div></div>
<div class="wrap" id="msg"></div>
<main id="app"></main>
<div class="vexit" id="viewExit" hidden><div class="box"><h3 style="margin:0">보기 모드 끄기</h3><p class="quiet">선생님 암호를 넣어 주세요.</p>
<input type="password" id="viewPin" inputmode="numeric" maxlength="8" autocomplete="off"><div><button class="go" id="viewOff">끄기</button> <button class="go quietbtn" id="viewCancel" style="margin-left:12px">취소</button></div></div></div>

<script src="config.js?v=4"></script>
<script>
/* ────────────────────────────────────────────────────────────────
   저장 (tuning-in과 같은 entries 표. 새로 실행할 SQL 없음)
     901 / 'cfg2'                        → 설정: 반·학생·단계·질문
     900 / 'r:<반>:<학생>:<단계>'          → 성찰 1건
   ──────────────────────────────────────────────────────────────── */
var CFG=window.REFLECT_CFG||{}, G_DATA=900, G_CFG=901, CKEY='cfg2';
var connected=false, loaded=false, freshStage=0;

var LEVELS=[{v:1,t:'아직'},{v:2,t:'조금'},{v:3,t:'충분히'}];
var HEX={think:'#3E5C6B',research:'#A85A43',comm:'#9A5F8C',team:'#6F8F5F',self:'#C9913F'};
function ATLS(){return (cfg.atl&&cfg.atl.length)?cfg.atl:DEFAULT.atl;}
/* 그 단계에서 묻기로 한 기능만 */
function stageATL(st){
  if(!st||!st.use||!st.use.length)return ATLS();
  var picked=ATLS().filter(function(a){return st.use.indexOf(a.k)>=0;});
  return picked.length?picked:ATLS();
}

var DEFAULT={
  pin:'1234',
  atl:[
    {k:'think',   label:'생각기능', ask:'견주어 보고 까닭을 찾았나요?'},
    {k:'research',label:'질문기능', ask:'필요한 자료를 스스로 찾았나요?'},
    {k:'comm',    label:'소통기능', ask:'내 생각을 친구가 알아듣게 말했나요?'},
    {k:'team',    label:'협력기능', ask:'모둠에서 내 몫을 했나요?'},
    {k:'self',    label:'자기기능', ask:'스스로 계획하고 끝까지 해냈나요?'}
  ],
  /* 모든 단계 공통 질문: AI·디지털 도구 (단계마다 켜고 끄기, 단계마다 고쳐 쓰기 가능) */
  aiQ:'AI·디지털 도구를 어떻게 활용했나요? 활용하면서 어떤 것을 느꼈나요?',
  classes:[
    {id:1,name:'4학년 1반',cur:1,students:[]},
    {id:2,name:'4학년 2반',cur:1,students:[]}
  ],
  stages:[
    {id:1,t:'준비하기',      s:'준비',  use:['think','self'],
     q:'이 주제에서 내가 가장 궁금한 것은 무엇인가요?'},
    {id:2,t:'조사하기 (공간)',s:'공간',  use:['research','comm'],
     q:'장소가 다르면 사는 모습도 다르다는 것을 어디에서 느꼈나요?'},
    {id:3,t:'조사하기 (시간)',s:'시간',  use:['research','think'],
     q:'옛날과 지금을 견주어 보고 새로 알게 된 것은 무엇인가요?'},
    {id:4,t:'조직·정리하기', s:'정리',  use:['think','team'],
     q:'흩어져 있던 자료를 모으니 어떤 묶음이 보였나요?'},
    {id:5,t:'일반화하기',    s:'일반화',use:['think','comm'],
     q:'우리가 찾은 것을 한 문장으로 쓴다면? 그렇게 생각한 까닭도 함께 써 보세요.'},
    {id:6,t:'전이하기',      s:'전이',  use:['think','comm','self'],
     q:'알게 된 것을 다른 고장이나 내 생활에 어떻게 써 볼 수 있을까요?'},
    {id:7,t:'성찰하기',      s:'성찰',  use:['self','team','think'],
     q:'이 단원을 시작할 때의 나와 지금의 나는 무엇이 달라졌나요?'}
  ]
};
var cfg=clone(DEFAULT), recs={}, draft={};
var cid=null, sid=null, view={s:'cls'}, tTab=1, tStage=0;
var unlocked=false, typed='', wrong=false, cfgDirty=false, justSaved=0;
try{unlocked=sessionStorage.getItem('reflect-teacher')==='1';}catch(e){}
var VIEW=false, vCls=null, vSt=null;
try{VIEW=localStorage.getItem('reflect-view')==='1';}catch(e){}
function maskName(n){n=String(n||'');if(n.length<2)return n;if(n.length===2)return n[0]+'○';return n[0]+'○'.repeat(n.length-2)+n[n.length-1];}

function clone(o){return JSON.parse(JSON.stringify(o));}

/* ── 서버 ── */
function api(p,o){o=o||{};
  if(VIEW&&o.method&&o.method!=='GET')return Promise.resolve(new Response(null,{status:204}));  /* 보기 모드: 쓰기 막음 */var h=Object.assign({'apikey':CFG.key,'Authorization':'Bearer '+CFG.key,'Content-Type':'application/json'},o.headers||{});
  return fetch(String(CFG.url||'').replace(/\/$/,'')+'/rest/v1/'+p,Object.assign({},o,{headers:h}));}
async function put(g,k,v){
  var r=await api('entries?on_conflict=group_id,key',{method:'POST',
    headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},
    body:JSON.stringify([{group_id:g,key:k,value:v,updated_at:new Date().toISOString()}])});
  if(!r.ok)throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,120));
}
async function loadAll(){
  var r=await api('entries?select=group_id,key,value&group_id=in.('+G_DATA+','+G_CFG+')');
  if(!r.ok)throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,120));
  var rows=await r.json(), nr={};
  rows.forEach(function(x){
    if(x.group_id===G_CFG&&x.key===CKEY&&x.value){cfg=Object.assign(clone(DEFAULT),x.value);renameSkills();}
    else if(x.group_id===G_DATA&&x.key.indexOf('r:')===0)nr[x.key.slice(2)]=x.value||{};
  });
  recs=nr; connected=true;
}
/* 예전 이름으로 저장된 기능 이름을 새 이름으로 바꿔 보여 줌 */
var OLDNAME={'사고기능':'생각기능','조사기능':'질문기능','의사소통기능':'소통기능','자기관리기능':'자기기능','사회적기능':'협력기능','협업기능':'협력기능'};
function renameSkills(){(cfg.atl||[]).forEach(function(a){if(OLDNAME[a.label])a.label=OLDNAME[a.label];});}
function aiOn(st){return !!st&&st.ai!==false;}
function aiQ(st){return (st&&st.aiq)||cfg.aiQ||DEFAULT.aiQ;}
function saveCfg(){return put(G_CFG,CKEY,cfg);}
function saveRec(c,s,st,v){recs[c+':'+s+':'+st]=v;return put(G_DATA,'r:'+c+':'+s+':'+st,v);}

/* ── 조회 ── */
function klass(id){return cfg.classes.filter(function(c){return c.id===id;})[0]||null;}
function stu(c,id){var k=klass(c);if(!k)return null;return k.students.filter(function(s){return s.id===id;})[0]||null;}
function stage(id){return cfg.stages.filter(function(s){return s.id===id;})[0]||null;}
function rec(c,s,st){return recs[c+':'+s+':'+st]||null;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function say(t,bad){document.getElementById('msg').innerHTML=t?'<p class="msg'+(bad?' bad':'')+'">'+esc(t)+'</p>':'';}

/* 세 단계 산 모양 */
function ridgeIcon(v){
  var d=v===1?'M5 28 Q30 23 55 28':v===2?'M5 28 L22 16 L34 22 L55 28':'M5 28 L17 19 L30 5 L43 19 L55 28';
  return '<svg viewBox="0 0 60 34" aria-hidden="true">'+
    '<path class="g" d="'+d+' L55 31 L5 31 Z" fill="none"/>'+
    '<path class="m" d="'+d+'"/></svg>';
}

/* ── 화면 ── */
/* 설정 칸을 구분하는 이름 — 화면을 다시 그려도 쓰던 글을 되돌려 놓는 데 씀 */
function fkey(el){
  var names=['cname','croster','sname','sshort','sq','saiq','aiq','alabel','aask','pin'];
  for(var i=0;i<names.length;i++)
    if(el.dataset[names[i]]!==undefined)return names[i]+':'+el.dataset[names[i]];
  return null;
}
function render(){
  var k=klass(cid), s=stu(cid,sid), A=document.getElementById('app');
  document.getElementById('state').innerHTML=
    (k?esc(k.name)+(s?' · <b>'+esc(s.name)+'</b>':''):'')+(connected?'':' · 연결 끊김');

  /* 쓰던 글과 커서 자리를 챙겨 둠 */
  var keep={}, fk=null, cs=0, ce=0, ae=document.activeElement;
  A.querySelectorAll('input,textarea').forEach(function(el){
    var key=fkey(el); if(!key)return;
    keep[key]=el.value;
    if(el===ae){fk=key;cs=el.selectionStart;ce=el.selectionEnd;}
  });

  document.body.classList.toggle('viewmode',VIEW);
  if(VIEW)document.getElementById('state').innerHTML='';
  var f=VIEW?scView:({cls:scClass,who:scWho,home:scHome,write:scWrite,teacher:scTeacher}[view.s]||scClass);
  A.innerHTML=f();

  A.querySelectorAll('input,textarea').forEach(function(el){
    var key=fkey(el); if(!key||keep[key]===undefined)return;
    el.value=keep[key];
    if(key===fk){el.focus();try{el.setSelectionRange(cs,ce);}catch(e){}}
  });
  wire();
}
function go(s,o){view=Object.assign({s:s},o||{});scrollTo(0,0);render();}

        '<div class="lv">'+sk.filter(function(a){return r[a.k];}).map(function(a){var lv=LEVELS.filter(function(l){return l.v===r[a.k];})[0];

function trailSVG(){
  var sts=cfg.stages, n=sts.length, W=620, H=86, L=34, R=W-34;
  var x=function(i){return L+i*(R-L)/(n-1);}, y=36;
  var k=klass(cid), cur=k?k.cur:0, g='';
  g+='<path d="M'+L+' '+y+' H'+R+'" stroke="var(--line)" stroke-width="1.5" fill="none"/>';
  var lastDone=-1; sts.forEach(function(st,i){if(rec(cid,sid,st.id))lastDone=i;});
  if(lastDone>0)g+='<path d="M'+L+' '+y+' H'+x(lastDone)+'" stroke="var(--near)" stroke-width="1.5" fill="none"/>';
  sts.forEach(function(st,i){
    var d=!!rec(cid,sid,st.id), now=st.id===cur;
    if(now&&!d)g+='<circle cx="'+x(i)+'" cy="'+y+'" r="12" fill="rgba(201,145,63,.16)"/>';
    g+='<circle class="'+(freshStage===st.id?'fresh':'')+'" cx="'+x(i)+'" cy="'+y+'" r="'+(d?7:5)+'" '+
       'fill="'+(d?'var(--near)':now?'var(--lit)':'var(--mist)')+'" '+
       'stroke="'+(d?'var(--near)':now?'var(--lit)':'var(--far)')+'" stroke-width="1.6"/>';
    g+='<text class="'+(now?'now':d?'done':'')+'" x="'+x(i)+'" y="'+(y+26)+'" text-anchor="middle">'+esc(st.s)+'</text>';
  });
  return '<div class="trail"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="일곱 단계 중 지나온 자리">'+g+'</svg></div>';
}
/* 기능마다 한 줄씩 — 선이 겹치지 않도록 따로 그린다 */
function ridgeChart(){
  var sts=cfg.stages, n=sts.length;
  /* 한 번이라도 물어본 기능만 줄로 그린다 */
  var list=ATLS().filter(function(a){
    return sts.some(function(st){var r=rec(cid,sid,st.id);return r&&r[a.k];});
  });
  if(!list.length)list=ATLS();
  var W=620, L=108, R=W-18, ROW=52, PLOT=30, TOP=10;
  var H=TOP+list.length*ROW+22;
  var x=function(i){return n<2?L:L+i*(R-L)/(n-1);};
  var g='';
  list.forEach(function(a,r){
    var top=TOP+r*ROW, base=top+PLOT;
    var y=function(v){return base-(v-1)*PLOT/2;};
    g+='<line x1="'+L+'" y1="'+base+'" x2="'+R+'" y2="'+base+'" stroke="var(--line)" stroke-width="1"/>';
    g+='<line x1="'+L+'" y1="'+top+'" x2="'+R+'" y2="'+top+'" stroke="var(--line)" stroke-width="1" opacity=".55"/>';
    g+='<text x="'+(L-14)+'" y="'+(base-PLOT/2+4)+'" text-anchor="end" font-size="12.5" '+
       'fill="var(--soft)" font-family="var(--sans)">'+esc(a.label)+'</text>';
    var pts=[];
    sts.forEach(function(st,i){var rr=rec(cid,sid,st.id); if(rr&&rr[a.k])pts.push([x(i),y(rr[a.k])]);});
    if(pts.length>1)g+='<polyline fill="none" stroke="'+HEX[a.k]+'" stroke-width="2.2" stroke-linecap="round" '+
      'stroke-linejoin="round" points="'+pts.map(function(p){return p[0]+','+p[1];}).join(' ')+'"/>';
    pts.forEach(function(p){g+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="'+HEX[a.k]+'"/>';});
  });
  sts.forEach(function(st,i){
    g+='<text x="'+x(i)+'" y="'+(H-6)+'" text-anchor="middle" font-size="11" fill="var(--soft)" '+
       'font-family="var(--sans)">'+esc(st.s)+'</text>';
  });
  return '<p class="quiet" style="margin-top:10px">줄마다 위로 올라갈수록 스스로 잘했다고 본 것입니다.</p>'+
    '<svg class="chart" viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block;margin:12px 0 6px" '+
    'role="img" aria-label="단계별 자기평가">'+g+'</svg>';
}

        '<p class="lbl" style="margin-top:12px">그래프에 쓸 짧은 이름</p>'+
        '<input class="t" data-sshort="'+i+'" value="'+esc(s.s)+'" style="font-size:15px;font-family:var(--sans)">'+
        '<p class="lbl" style="margin-top:12px">성찰 질문 ① 이해 · 과정</p>'+
        '<textarea data-sq="'+i+'" style="min-height:76px">'+esc(s.q)+'</textarea>'+
        '<p class="lbl" style="margin-top:12px">성찰 질문 ② AI · 디지털 도구 (모든 단계 공통)</p>'+
        '<div class="chips" style="margin:6px 0 8px"><button data-ai="'+i+'" aria-pressed="'+aiOn(s)+'">'+(aiOn(s)?'켜짐 · 이 단계에서 물어요':'꺼짐 · 이 단계에서는 묻지 않아요')+'</button></div>'+
        (aiOn(s)?'<textarea data-saiq="'+i+'" style="min-height:62px">'+esc(aiQ(s))+'</textarea>'+
          (s.aiq?'<p class="quiet" style="margin-top:6px">이 단계만 따로 고친 질문이에요. 공통 질문과 똑같이 맞추면 다시 공통 질문을 따라가요.</p>':''):'')+
        '<p class="lbl" style="margin-top:14px">이 단계에서 물어볼 탐구 기능</p>'+
        '<div class="chips">'+ATLS().map(function(a){
          var on=stageATL(s).some(function(x){return x.k===a.k;});
          return '<button data-use="'+i+'" data-k="'+a.k+'" aria-pressed="'+on+'" '+
            'style="'+(on?'border-color:'+HEX[a.k]+';color:'+HEX[a.k]+';background:#fff;font-weight:500':'')+'">'+
            esc(a.label)+'</button>';
        }).join('')+'</div></div>';
    }).join('')+
    '<h3 style="margin-top:26px">탐구 기능 '+ATLS().length+'가지 · 스스로 재어 보기</h3>'+
    '<p class="quiet">모든 단계에 똑같이 나옵니다. 아이가 '+ATLS().length+'번 눌러야 하니, 이름과 묻는 말은 되도록 짧게 두세요.</p>'+
    ATLS().map(function(a,i){
      return '<div class="setblock">'+
        '<span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:'+HEX[a.k]+'"></span>'+
        '<input class="t" data-alabel="'+i+'" value="'+esc(a.label)+'" style="width:calc(100% - 22px);margin-left:8px">'+
        '<p class="lbl" style="margin-top:12px">아이에게 묻는 말</p>'+
        '<textarea data-aask="'+i+'" style="min-height:62px">'+esc(a.ask)+'</textarea></div>';
    }).join('')+

    '<div class="setblock"><p class="lbl">선생님 암호 — 숫자 네 자리</p>'+
    '<input class="t" data-pin value="'+esc(cfg.pin||'1234')+'" inputmode="numeric" maxlength="4" style="font-family:var(--sans);font-size:17px;letter-spacing:.3em">'+
    '<p class="quiet" style="margin-top:8px">제목 <b>돌아보는 길</b>을 1초쯤 누르고 있으면 이 화면이 열립니다. 아이들이 우연히 들어오는 것을 막는 정도이지, 완전한 잠금은 아닙니다.</p></div>'+

    '<div style="margin-top:20px"><button class="go" id="cSave">설정 저장</button>'+
    '</div>'+
    '</div>';
}

/* ── 연결 ── */
function wire(){
  var A=document.getElementById('app');
  A.querySelectorAll('[data-vcls]').forEach(function(b){b.onclick=function(){vCls=+b.dataset.vcls;vSt=null;render();};});
  A.querySelectorAll('[data-vst]').forEach(function(b){b.onclick=function(){vSt=+b.dataset.vst;render();};});
  var vo=A.querySelector('#viewOn'); if(vo)vo.onclick=function(){VIEW=true;try{localStorage.setItem('reflect-view','1');}catch(e){}vCls=tTab;vSt=null;scrollTo(0,0);render();};
  A.querySelectorAll('[data-cls]').forEach(function(b){b.onclick=function(){
    cid=+b.dataset.cls; try{localStorage.setItem('reflect-cls',cid);}catch(e){} go('who');};});
  A.querySelectorAll('[data-who]').forEach(function(b){b.onclick=function(){
    sid=+b.dataset.who; freshStage=0; go('home');};});
  A.querySelectorAll('[data-open]').forEach(function(b){b.onclick=function(){
    draft={}; go('write',{st:+b.dataset.open});};});
  A.querySelectorAll('[data-back]').forEach(function(b){b.onclick=function(){
    var t=b.dataset.back; if(t==='teacher'){view.see=0;go('teacher');} else go(t);};});
  A.querySelectorAll('[data-k]').forEach(function(b){b.onclick=function(){
    var t=document.getElementById('note'); if(t)draft.note=t.value;
    var t2=document.getElementById('note2'); if(t2)draft.ai=t2.value;
    draft[b.dataset.k]=+b.dataset.v; render();};});
  A.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){tTab=+b.dataset.tab;tStage=0;render();};});
  A.querySelectorAll('[data-vs]').forEach(function(b){b.onclick=function(){tStage=+b.dataset.vs;render();};});
  A.querySelectorAll('[data-see]').forEach(function(b){b.onclick=function(){
    cid=tTab; sid=+b.dataset.see; go('teacher',{see:1});};});
  A.querySelectorAll('[data-cur]').forEach(function(b){b.onclick=async function(){
    var k=klass(tTab); k.cur=+b.dataset.cur; render();
    try{await saveCfg(); say('');}catch(e){say('지금 단계를 저장하지 못했습니다. '+e.message,1);}};});

  var sv=A.querySelector('#save');
  if(sv)sv.onclick=async function(){
    var t=document.getElementById('note');
    var t2=document.getElementById('note2'), old2=rec(cid,sid,draft.__st);
    var v={note:t?t.value.trim():'',ts:Date.now()};
    if(t2)v.ai=t2.value.trim(); else if(old2&&old2.ai)v.ai=old2.ai;
    stageATL(stage(draft.__st)).forEach(function(a){v[a.k]=draft[a.k]||0;});
    sv.textContent='남기는 중…';
    var st=draft.__st, ok=true;
    try{ await saveRec(cid,sid,st,v); }
    catch(e){ ok=false; recs[cid+':'+sid+':'+st]=v;
      say('서버에 보내지 못해 이 태블릿에만 남았습니다. 선생님께 알려 주세요. '+e.message,1); }
    draft={}; freshStage=st; justSaved=ok?st:0; go('home');
    setTimeout(function(){freshStage=0;},1200);
    if(ok)setTimeout(function(){ if(justSaved===st){justSaved=0; if(view.s==='home')render();} },7000);
  };
  var cc=A.querySelector('#cancel'); if(cc)cc.onclick=function(){draft={};go('home');};
  var pr=A.querySelector('#print'); if(pr)pr.onclick=function(){print();};

  A.querySelectorAll('[data-d]').forEach(function(b){b.onclick=function(){
    var d=b.dataset.d;
    if(d==='out'){typed='';wrong=false;go(cid?'who':'cls');return;}
    if(d==='back'){typed=typed.slice(0,-1);wrong=false;render();return;}
    typed+=d; wrong=false;
    if(typed.length===4){
      if(typed===String(cfg.pin||'1234')){
        unlocked=true; typed='';
        try{sessionStorage.setItem('reflect-teacher','1');}catch(e){}
        tTab=cid||cfg.classes[0].id;
      } else { wrong=true; typed=''; }
    }
    render();
  };});
  A.querySelectorAll('[data-ai]').forEach(function(b){b.onclick=function(){
    var s=cfg.stages[+b.dataset.ai]; s.ai=!aiOn(s); cfgDirty=true; render();};});
  A.querySelectorAll('[data-use]').forEach(function(b){b.onclick=function(){
    var s=cfg.stages[+b.dataset.use], k=b.dataset.k;
    if(!s.use||!s.use.length)s.use=ATLS().map(function(a){return a.k;});
    var at=s.use.indexOf(k);
    if(at>=0){ if(s.use.length<=1)return; s.use.splice(at,1); } else s.use.push(k);
    cfgDirty=true; render();
  };});
  var sb=A.querySelector('#setupBtn');
  if(sb)sb.onclick=function(){typed='';wrong=false;tTab=cid||cfg.classes[0].id;go('teacher');};
  var lb=A.querySelector('#lockBtn');
  if(lb)lb.onclick=function(){
    unlocked=false; typed='';
    try{sessionStorage.removeItem('reflect-teacher');localStorage.removeItem('reflect-teacher');}catch(e){}
    go(cid?'who':'cls');
  };

  var cs=A.querySelector('#cSave');
  if(cs)cs.onclick=async function(){
    cfg.classes.forEach(function(c,i){
      var nm=A.querySelector('[data-cname="'+i+'"]'), ro=A.querySelector('[data-croster="'+i+'"]');
      if(nm)c.name=nm.value.trim()||c.name;
      if(ro){
        var names=ro.value.split('\n').map(function(x){return x.trim();}).filter(Boolean);
        var old=c.students.slice(), next=Math.max(0,...old.map(function(s){return s.id;}))+1;
        c.students=names.map(function(n,j){
          var hit=old.filter(function(o){return o.name===n;})[0];
          return {id:hit?hit.id:next++, n:j+1, name:n};
        });
      }
    });
    cfg.stages.forEach(function(s,i){
      var a=A.querySelector('[data-sname="'+i+'"]'), b=A.querySelector('[data-sshort="'+i+'"]'),
          q=A.querySelector('[data-sq="'+i+'"]');
      if(a)s.t=a.value.trim()||s.t; if(b)s.s=b.value.trim()||s.s; if(q)s.q=q.value.trim()||s.q;
    });
    var oldQ=cfg.aiQ||DEFAULT.aiQ, cq=A.querySelector('[data-aiq]'); if(cq&&cq.value.trim())cfg.aiQ=cq.value.trim();
    cfg.stages.forEach(function(s,i){
      var e=A.querySelector('[data-saiq="'+i+'"]'); if(!e)return;
      var v=e.value.trim(); if(!v||v===cfg.aiQ||(!s.aiq&&v===oldQ))delete s.aiq; else s.aiq=v;
    });
    if(!cfg.atl||!cfg.atl.length)cfg.atl=clone(DEFAULT.atl);
    cfg.atl.forEach(function(a,i){
      var l=A.querySelector('[data-alabel="'+i+'"]'), q=A.querySelector('[data-aask="'+i+'"]');
      if(l)a.label=l.value.trim()||a.label; if(q)a.ask=q.value.trim()||a.ask;
    });
    var pn=A.querySelector('[data-pin]');
    if(pn){var p=pn.value.replace(/\D/g,'').slice(0,4); if(p.length===4)cfg.pin=p;}
    cs.textContent='저장하는 중…';
    try{ await saveCfg(); cfgDirty=false; say('설정을 저장했습니다.'); }
    catch(e){ say('설정을 저장하지 못했습니다. '+e.message,1); }
    render();
  };
}
/* 숨은 입구 — 제목을 1초쯤 누르고 있기 */
(function(){
  var T=document.getElementById('title'), t=null;
  function open(){ if(VIEW||view.s==='teacher')return; typed='';wrong=false;
    tTab=cid||cfg.classes[0].id; go('teacher'); }
  function down(){ clearTimeout(t); t=setTimeout(open,900); }
  function up(){ clearTimeout(t); }
  T.addEventListener('pointerdown',down);
  ['pointerup','pointerleave','pointercancel'].forEach(function(e){T.addEventListener(e,up);});
  T.addEventListener('contextmenu',function(e){e.preventDefault();});
})();

(function(){var vb=document.getElementById('viewbar'),lt=null,X=document.getElementById('viewExit'),P=document.getElementById('viewPin');
  vb.addEventListener('pointerdown',function(){if(!VIEW)return;clearTimeout(lt);lt=setTimeout(function(){P.value='';X.hidden=false;setTimeout(function(){P.focus();},50);},2000);});
  ['pointerup','pointerleave','pointercancel'].forEach(function(n){vb.addEventListener(n,function(){clearTimeout(lt);});});
  vb.addEventListener('contextmenu',function(e){e.preventDefault();});
  function off(){if(P.value.trim()!==String(cfg.pin||'1234')){P.value='';P.focus();say('암호가 맞지 않아요.',1);return;}
    VIEW=false;try{localStorage.removeItem('reflect-view');}catch(e){}X.hidden=true;say('');go(cid?'who':'cls');}
  document.getElementById('viewOff').onclick=off;
  P.addEventListener('keydown',function(e){if(e.key==='Enter')off();});
  document.getElementById('viewCancel').onclick=function(){X.hidden=true;};
})();

/* ── 시작 ── */
(async function(){
  try{ await loadAll(); }
  catch(e){ say('서버에 연결하지 못했습니다. 남긴 글이 공유되지 않습니다. '+e.message,1); }
  /* ?start=1 로 들어오면 기억해 둔 반을 지우고 반 고르기부터 시작 */
  if(/[?&]start=1/.test(location.search)){ try{localStorage.removeItem('reflect-cls');}catch(e){} }
  else { try{ var c=+localStorage.getItem('reflect-cls'); if(klass(c))cid=c; }catch(e){} }
  loaded=true;
  if(/[?&]t=1/.test(location.search)){ tTab=cid||cfg.classes[0].id; go('teacher'); }
  else go(cid?'who':'cls');
  setInterval(function(){
    var live=VIEW||['teacher','who','cls'].indexOf(view.s)>=0;
    var ae=document.activeElement;
    var typing=ae&&/^(INPUT|TEXTAREA)$/.test(ae.tagName);
    if(!live||typing)return;
    if(view.s==='teacher'&&cfgDirty)return;   /* 저장 안 한 설정이 있으면 건드리지 않음 */
    loadAll().then(function(){
      var ae2=document.activeElement;
      if(ae2&&/^(INPUT|TEXTAREA)$/.test(ae2.tagName))return;
      if(VIEW||['teacher','who','cls'].indexOf(view.s)>=0)render();
    }).catch(function(){});
  },6000);
})();
</script>
