<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>문경 취재 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#E9E4DA;      /* 책상 */
  --paper:#FBF8F1;     /* 수첩 종이 */
  --rule:#E3DCCB;      /* 줄 */
  --ink:#2B2A27;       /* 연필 */
  --soft:#5C564E;      /* 흐린 글씨 */
  --past:#F2E7D2;      /* 과거 장: 낡은 종이 */
  --pastInk:#4A3F33;   /* 석탄 */
  --now:#EAF3F8;       /* 현재 장: 맑은 하늘 */
  --nowInk:#245B80;
  --note:#FFF3B0;      /* 포스트잇 */
  --open:#D9622B;      /* 오늘 쓰는 칸 */
  --ok:#3E7D4E;
  --bad:#B23A2E;
  --nat:#5C8A4B;       /* 자연을 이용한 것 */
  --man:#8C5A3C;       /* 사람이 만든 것 */
  --hand:'Nanum Pen Script',cursive;
  --body:'Gowun Dodum',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--desk);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65;padding:0 16px 120px}
.wrap{max-width:760px;margin:0 auto}
.wide{max-width:1180px;margin:0 auto}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
button:disabled{cursor:not-allowed;opacity:.5}
input,textarea,select{font-family:inherit;font-size:17px;color:var(--ink)}
:focus-visible{outline:2.5px solid var(--nowInk);outline-offset:2px;border-radius:4px}

header.top{max-width:1180px;margin:0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:18px 0 10px}
#title{font-family:var(--hand);font-size:34px;line-height:1;margin:0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#state{font-size:14px;color:var(--soft);text-align:right}
#state b{color:var(--ink)}
.msg{max-width:760px;margin:6px auto;padding:10px 14px;border-radius:10px;background:#E4F0E6;color:var(--ok);font-size:15px}
.msg.bad{background:#F7E1DD;color:var(--bad)}

/* 수첩 */
.page{background:var(--paper);border-radius:6px 14px 14px 6px;padding:22px 22px 26px;
  box-shadow:0 1px 0 #d8d0bf,0 10px 24px -14px rgba(60,50,30,.35);
  background-image:linear-gradient(to right,transparent 0 30px,#E9B4A8 30px 31.5px,transparent 31.5px);
  padding-left:48px;border-left:10px solid #CDBF9F}
.page.past{background-color:var(--past);border-left-color:#5A4E40}
.page.now{background-color:var(--now);border-left-color:#5B8DB0}
h2.hand{font-family:var(--hand);font-size:36px;font-weight:400;margin:0 0 6px;line-height:1.1}
.sub{color:var(--soft);font-size:15px;margin:0 0 14px}

/* 고르기 */
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
@media (max-width:560px){.pick{grid-template-columns:repeat(2,1fr)}}
.pick button{background:#fff;border:2px solid #CFC6B3;border-radius:10px;padding:16px 12px;font-size:20px;text-align:center;min-height:68px;
  box-shadow:0 2px 0 rgba(0,0,0,.06);transition:transform .1s ease-out,border-color .1s}
.pick button:hover{border-color:var(--ink)} .pick button:active{transform:translateY(2px)}
.pick button span{display:block;font-size:13px;color:var(--soft)}
.grp{margin-top:18px}
.grp h3{font-family:var(--hand);font-size:28px;font-weight:400;margin:0}

/* 장 넘기기 */
.tabs{display:flex;gap:6px;margin:10px 0 0;padding-left:16px;align-items:flex-end;flex-wrap:wrap}
.tabs button{padding:10px 20px 9px;border-radius:12px 12px 0 0;background:#DDD5C6;border:1px solid rgba(60,50,30,.12);border-bottom:none;
  font-size:17px;color:var(--soft);min-height:48px;transform:translateY(3px);transition:transform .15s ease-out}
.tabs button:hover{transform:translateY(0)}
.tabs button.on{transform:none;color:var(--ink);font-weight:400;box-shadow:0 -2px 6px -4px rgba(60,50,30,.4)}
.tabs button.t-past.on{background:var(--past)} .tabs button.t-now.on{background:var(--now)} .tabs button.t-cmp.on{background:var(--paper)}
.tabs button.t-past{border-top:3px solid #5A4E40} .tabs button.t-now{border-top:3px solid #5B8DB0} .tabs button.t-cmp{border-top:3px solid #CDBF9F}
.tabs .tipbtn{margin-left:auto;align-self:center;transform:none;border-radius:4px 4px 12px 4px;border:1px solid #E2CF6E;border-bottom:1px solid #E2CF6E}
.wrap > .page{border-top-left-radius:0}
.tabs button.on:not([class*="t-"]){background:#fff}
.tabs .who{margin-left:auto;font-size:14px;color:var(--soft);padding:10px 4px;border:none;background:none;transform:none;min-height:0;box-shadow:none}
.tabs .who + .who{margin-left:8px}
.tabtools{display:inline-flex;gap:6px;align-items:center}
.swap{font-size:14px;color:var(--soft);text-decoration:underline;text-underline-offset:3px;padding:4px 2px;margin-left:8px}

/* 칸 */
.slot{margin:18px 0 0;padding:14px 0 6px;border-top:2px dashed rgba(0,0,0,.12)}
.slot:first-of-type{border-top:none;margin-top:4px}
.slot h3{margin:0;font-size:21px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{font-size:13px;padding:2px 10px;border-radius:999px;font-weight:400}
.badge.open{background:var(--open);color:#fff}
.badge.shut{background:rgba(0,0,0,.08);color:var(--soft)}
.ask{margin:4px 0 8px;font-size:16px}
.tip{font-size:14px;color:var(--soft);margin:2px 0 8px}
.slot.isopen{background:rgba(255,255,255,.55);border-radius:12px;padding:14px;border:2px solid var(--open);margin-top:18px}

.cards{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.card{background:var(--note);border-radius:3px 3px 14px 3px;padding:10px 12px 8px;min-width:170px;max-width:100%;flex:1 1 220px;
  box-shadow:0 2px 0 rgba(0,0,0,.06),0 6px 12px -8px rgba(0,0,0,.3)}
.card .t{font-size:17px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.card .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--soft)}
.card.mine{outline:2px solid rgba(0,0,0,.15)}
.card.local{background:#FCE3D9}
.tag{font-size:12px;padding:1px 8px;border-radius:999px;background:rgba(0,0,0,.08);color:var(--ink)}
.tag.nat{background:var(--nat);color:#fff}
.tag.man{background:var(--man);color:#fff}
.tag.w{background:#fff;border:1px solid rgba(0,0,0,.15)}
.lk{font-size:13px;text-decoration:underline;color:var(--soft);padding:4px 2px}
.lk.danger{color:var(--bad)}
.empty{color:var(--soft);font-size:15px;margin:6px 0}

/* 쓰기 */
.form{margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chips button{padding:6px 14px;border-radius:10px;background:var(--paper);border:2px solid #CFC6B3;font-size:16px;min-height:44px}
.chips button.on{background:var(--ink);color:#FBF8F1;border-color:var(--ink)}
.chips .lab{font-size:13px;color:var(--soft);align-self:center;margin-right:4px;flex-basis:100%}
.hint{font-size:15px;color:var(--nowInk);margin:4px 0}
textarea{width:100%;min-height:76px;padding:6px 12px;border:1.5px solid #CFC6B3;border-radius:10px;resize:vertical;line-height:32px;
  background-color:#fff;background-image:repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);background-position:0 6px;background-attachment:local}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.btn{background:var(--ink);color:#FBF8F1;border:2px solid var(--ink);border-radius:10px;padding:10px 20px;font-size:17px;min-height:48px;
  box-shadow:0 2px 0 rgba(0,0,0,.18);transition:transform .1s ease-out,box-shadow .1s ease-out}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn:disabled{opacity:1;background:transparent;color:var(--soft);border:2px dashed #BDB3A0;box-shadow:none}
.btn.ghost{background:var(--paper);color:var(--ink);border:2px solid #CFC6B3;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.why{font-size:14px;color:var(--soft)}
.saved{font-size:16px;color:var(--ok)}
.local-note{font-size:14px;color:var(--bad)}

.lines{margin:8px 0;padding:0;list-style:none}
.lines li{padding:6px 0;border-bottom:1px dotted rgba(0,0,0,.15)}
.lines li b{font-weight:400;color:var(--soft);font-size:14px;margin-right:6px}

/* 육하원칙 칸 */
.w5grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;margin:6px 0}
.w5grid label{min-width:0;display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #CFC6B3;border-radius:10px;padding:4px 4px 4px 10px}
.w5grid label:focus-within{border-color:var(--nowInk)}
.w5grid span{flex:0 0 56px;font-size:16px;color:var(--pastInk)}
.w5grid input{flex:1;min-width:0;border:none;background:transparent;padding:8px 4px;font-size:17px;outline:none}
@media (max-width:640px){.w5grid{grid-template-columns:1fr}}
.fx{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0;font-size:16px}
.fx dt{color:var(--soft);font-size:14px}
.fx dd{margin:0;overflow-wrap:anywhere}
.card .w5grid{grid-template-columns:1fr}
/* 취재 팁 */
.tipbtn{background:var(--note);border:1.5px solid #E2CF6E;border-radius:999px;padding:10px 16px;font-size:16px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.modal{position:fixed;inset:0;background:rgba(40,35,25,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:20}
.tipcard{background:var(--note);max-width:560px;width:100%;border-radius:4px 4px 18px 4px;padding:20px 22px;box-shadow:0 18px 40px -16px rgba(0,0,0,.5)}
.tipcard h3.hand{font-family:var(--hand);font-size:38px;font-weight:400;margin:0 0 8px}
.tipcard h4{margin:14px 0 4px;font-size:16px}
.tipgen{font-size:16px;color:var(--pastInk)}
.tipex{background:rgba(255,255,255,.7);border-radius:8px;padding:10px 12px;font-size:16px;line-height:1.7}
/* 칸 고르기·두 줄기 */
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.pagehead h2.hand{margin:0}
.picker{display:flex;gap:6px;flex-wrap:wrap}
.picker button{position:relative;padding:8px 16px;border-radius:10px;border:2px solid #CFC6B3;background:var(--paper);font-size:17px;min-height:48px}
.picker button.on{background:var(--ink);color:#FBF8F1;border-color:var(--ink)}
.picker .today{display:inline-block;margin-left:6px;font-size:12px;padding:1px 7px;border-radius:999px;background:var(--open);color:#fff;vertical-align:2px}
.picker .cnt{display:inline-block;margin-left:6px;font-size:12px;padding:0 7px;border-radius:999px;background:rgba(0,0,0,.1)}
.picker button.on .cnt{background:rgba(255,255,255,.25)}
.askrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 12px}
.askrow .ask{margin:0;font-size:18px}
.colh{margin:0 0 6px;font-size:15px;font-weight:400;color:var(--soft)}
.colh span{margin-left:4px}
.col-write{background:rgba(255,255,255,.72);border:2px solid var(--open);border-radius:12px;padding:14px;margin-top:14px}
.col-write.shut{border-color:#CFC6B3}
.cmpgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.cmpgrid .col-write{grid-column:1 / -1}
@media (orientation:landscape) and (min-width:900px){
  .wrap{max-width:1320px}
  header.top{padding:10px 0 2px} #title{font-size:28px}
  .split{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
  .split.solo{grid-template-columns:1fr}
  .col-write{margin-top:0;position:sticky;top:10px}
  .split .w5grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cmpgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.15fr);align-items:start}
  .cmpgrid .col-write{grid-column:auto;position:sticky;top:10px}
  .pick{grid-template-columns:repeat(5,1fr)}
  .modal{justify-content:flex-end;align-items:stretch;padding:0}
  .tipcard{max-width:440px;border-radius:18px 0 0 18px;overflow:auto;max-height:100vh}
  .page{padding-top:16px;padding-bottom:20px}
}
/* 비교 */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{border-radius:10px;padding:10px 12px}
.mini.past{background:var(--past)} .mini.now{background:var(--now)}
.mini h4{margin:0 0 4px;font-family:var(--hand);font-size:26px;font-weight:400}
.mini h5{margin:8px 0 2px;font-size:14px;color:var(--soft);font-weight:400}
.mini ul{margin:0;padding-left:18px;font-size:15px}
@media (max-width:640px){.cols{grid-template-columns:1fr}}

/* 선생님 */
.panel{background:#fff;border-radius:12px;padding:16px;margin:14px 0;border:1px solid var(--rule)}
.panel h3{margin:0 0 6px;font-size:19px}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.toggles button{padding:10px 14px;border-radius:10px;border:1.5px solid var(--rule);background:#fff;font-size:15px}
.toggles button.on{background:var(--open);color:#fff;border-color:var(--open)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--rule);padding:6px 8px;text-align:left;vertical-align:top}
th{font-weight:400;color:var(--soft);font-size:13px}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.board .col{background:var(--paper);border-radius:10px;padding:10px;border:1px solid var(--rule)}
.board .col h4{margin:0;font-family:var(--hand);font-size:28px;font-weight:400}
.board h5{margin:8px 0 4px;font-size:14px;color:var(--soft);font-weight:400}
.board .card{flex:1 1 100%;min-width:0}
.big .board .card .t,.big .board .fx dd{font-size:24px}
.big .board .col h4{font-size:36px}
.f{display:grid;grid-template-columns:150px 1fr;gap:6px 10px;align-items:center;margin:4px 0}
.f input,.f select{width:100%;padding:8px 10px;border:1.5px solid #CFC6B3;border-radius:8px;background:#fff}
.sel{padding:6px 8px;border:1.5px solid #CFC6B3;border-radius:8px;background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center;margin:16px 0}
.pad button{height:64px;border-radius:12px;background:#fff;border:1.5px solid var(--rule);font-size:24px}
.dots{text-align:center;font-size:30px;letter-spacing:10px;min-height:44px}
@media (max-width:640px){.f{grid-template-columns:1fr}}
/* ── 글씨 정리 ── */
*{font-synthesis:none}  /* 고운돋움에는 굵은 글씨가 없어서 번져 보이지 않게 */
b,strong{font-weight:400;color:var(--ink);background:linear-gradient(transparent 58%,#FFE58A 58%)}  /* 형광펜 */
.lines li b{background:none}
body{font-size:18px}
input,textarea,select{font-size:18px}
#state{font-size:15px}
.badge{font-size:14px}
.card .meta,.lk,.why,.local-note,.swap{font-size:15px}
.tag{font-size:14px}
.chips .lab,.colh,.fx dt,.mini h5,.lines li b{font-size:15px}
.hint{font-size:16px}
.picker .today,.picker .cnt{font-size:13px}
.pick button span{font-size:15px}
/* 시작 화면: 크게, 빈 곳 없이 */
.page.start{min-height:calc(100vh - 110px);display:flex;flex-direction:column}
.page.start h2.hand{font-size:46px}
.page.start .sub{font-size:20px}
.page.start .pick button{font-size:26px;min-height:88px}
.page.start .grp h3{font-size:34px}
.pick.cls{flex:1;align-content:center}
.page.start .pick.cls button{font-size:34px;min-height:180px}
.page.start .pick.cls button span{font-size:18px;margin-top:6px}
@media (orientation:landscape) and (min-width:900px){
  body{font-size:20px}
  input,textarea,select{font-size:20px}
  h2.hand{font-size:44px}
  .askrow .ask{font-size:22px}
  .picker button,.tabs button,.btn,.chips button{font-size:19px}
  .card .t,.fx dd{font-size:19px}
  .w5grid input{font-size:19px}
  .w5grid span{font-size:17px}
  .hint{font-size:17px}
  .mini ul{font-size:17px}
  .tipgen,.tipex{font-size:18px}
  .page.start .pick{grid-template-columns:repeat(5,1fr)}
  .page.start .pick.cls{grid-template-columns:repeat(3,1fr)}
  .page.start .pick.cls button{min-height:260px;font-size:44px}
}
/* ── 색 ── */
.page.past{background-image:linear-gradient(to right,transparent 0 30px,#D9A89A 30px 31.5px,transparent 31.5px),
  linear-gradient(to bottom,#E6D3B3 0,rgba(242,231,210,0) 150px)}
.page.now{background-image:linear-gradient(to right,transparent 0 30px,#E9B4A8 30px 31.5px,transparent 31.5px),
  linear-gradient(to bottom,#CFE4F2 0,rgba(234,243,248,0) 150px)}
.page.past h2.hand{color:var(--pastInk)}
.page.now h2.hand{color:var(--nowInk)}
.page.now .w5grid span{color:var(--nowInk)}
.mini.now{background:#DDEDF7}
.mini.now h4{color:var(--nowInk)} .mini.past h4{color:var(--pastInk)}
.badge.shut{background:rgba(60,50,30,.1);color:var(--soft)}
::selection{background:#FFE58A;color:var(--ink)}
input,textarea{caret-color:var(--open)}
html{scrollbar-color:#BFB49F transparent}
/* ── 마무리 ── */
.card{position:relative}
.card.mine::before{content:'';position:absolute;top:-7px;left:50%;width:58px;height:15px;transform:translateX(-50%) rotate(-2deg);
  background:rgba(217,98,43,.32);border-radius:2px}
.card.mine{outline:none}
.tipcard .btn{min-width:140px}
.empty{color:var(--soft)}
/* 반 고르기: 반 수에 맞춰 가운데로 */
.page.start.center{justify-content:center;align-items:center;text-align:center;padding-left:48px;padding-right:48px}
.page.start.center .pick.cls{flex:0 0 auto;width:100%;grid-template-columns:repeat(var(--n,2),minmax(0,360px));justify-content:center;margin-top:28px}
@media (orientation:landscape) and (min-width:900px){
  .page.start.center .pick.cls{grid-template-columns:repeat(var(--n,2),minmax(0,380px))}
}
@media (max-width:560px){.page.start.center .pick.cls{grid-template-columns:1fr}}
/* 취재 자료 */
.tabs .tipbtn + .tipbtn{margin-left:6px}
.linkpanel h4{margin:16px 0 6px}
.linkcard{display:block;background:rgba(255,255,255,.85);border-radius:10px;padding:12px 14px;margin:8px 0;color:var(--ink);text-decoration:none;
  border:2px solid transparent;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.linkcard:hover,.linkcard:focus-visible{border-color:var(--nowInk)}
.linkcard .lt{display:block;font-size:18px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(36,91,128,.4)}
.linkcard .lf{display:block;font-size:16px;color:var(--soft);margin-top:4px}
.linkcard .lv{display:inline-block;margin-top:6px;font-size:14px;padding:1px 10px;border-radius:999px;background:rgba(0,0,0,.08)}
</style>
</head>
<body>
<header class="top">
  <h1 id="title">문경 타임머신 기자단 · 취재 노트</h1>
  <div id="state"></div>
</header>
<div id="msg"></div>
<main id="app"></main>

<script src="config.js?v=1"></script>
<script>
/* ────────────────────────────────────────────────────────────────
   저장 (사진 짝·성찰 앱과 같은 entries 표. 새로 실행할 SQL 없음)
     911 / 'cfg'                          → 설정: 반·명단·모둠·열린 칸·문구·암호
     910 / 'c:<반>:<모둠>:<장>:<칸>:<id>'  → 카드 한 장 (장: past·now·cmp)

function clone(o){return JSON.parse(JSON.stringify(o));}
function merge(def,v){ /* 저장된 설정에 빠진 항목은 기본값으로 채움 */
  if(Array.isArray(def))return Array.isArray(v)?v:clone(def);
  if(def&&typeof def==='object'){var o={};for(var k in def)o[k]=merge(def[k],v&&v[k]);
    if(v&&typeof v==='object')for(var j in v)if(!(j in o))o[j]=v[j];return o;}
  return v===undefined||v===null?def:v;
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function api(p,o){o=o||{};var h=Object.assign({'apikey':CFG.key,'Authorization':'Bearer '+CFG.key,'Content-Type':'application/json'},o.headers||{});
  return fetch(String(CFG.url||'').replace(/\/$/,'')+'/rest/v1/'+p,Object.assign({},o,{headers:h}));}
async function put(g,k,v){
  var r=await api('entries?on_conflict=group_id,key',{method:'POST',
    headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},
    body:JSON.stringify([{group_id:g,key:k,value:v,updated_at:new Date().toISOString()}])});
  if(!r.ok)throw new Error('HTTP '+r.status);
}
async function del(g,k){
  var r=await api('entries?group_id=eq.'+g+'&key=eq.'+encodeURIComponent(k),{method:'DELETE',headers:{'Prefer':'return=minimal'}});
  if(!r.ok)throw new Error('HTTP '+r.status);
}
async function loadCfg(){
  var r=await api('entries?select=value&group_id=eq.'+G_CFG+'&key=eq.'+CKEY);
  if(!r.ok)throw new Error('HTTP '+r.status);
  var rows=await r.json();
  if(rows.length&&rows[0].value)cfg=merge(DEFAULT,rows[0].value);
  connected=true;
}
async function loadData(c){
  if(!c)return;
  var q='entries?select=key,value&group_id=eq.'+G_DATA+'&or=(key.like.c:'+c+':*,key.like.l:'+c+':*)';
  var r=await api(q); if(!r.ok)throw new Error('HTTP '+r.status);
  var rows=await r.json(), nc={}, nl={};
  rows.forEach(function(x){ if(!x.value)return;
    if(x.key.indexOf('c:')===0)nc[x.key]=x.value; else if(x.key.indexOf('l:')===0)nl[x.key]=x.value; });
  /* 다른 반 기록은 그대로 두고 이 반만 바꿈 */
  Object.keys(cards).forEach(function(k){if(k.split(':')[1]!==String(c))nc[k]=cards[k];});
  Object.keys(lines).forEach(function(k){if(k.split(':')[1]!==String(c))nl[k]=lines[k];});
  cards=nc; lines=nl; overlayPending(); connected=true;
}

function pend(){try{return JSON.parse(localStorage.getItem('rn-pending')||'[]');}catch(e){return [];}}
function setPend(a){try{localStorage.setItem('rn-pending',JSON.stringify(a));}catch(e){}}
function addPend(item){var a=pend().filter(function(x){return x.k!==item.k;});a.push(item);setPend(a);}
function overlayPending(){ /* 지금 고른 사람이 못 보낸 글만 보여 줌 */
  pend().forEach(function(p){ if(p.sid!==sid||p.cls!==cid)return;
    var box=p.k.indexOf('c:')===0?cards:lines;
    if(p.del)delete box[p.k]; else box[p.k]=Object.assign({},p.v,{_local:1}); });
}
async function flush(){
  var a=pend(); if(!a.length)return;
  var left=[];
  for(var i=0;i<a.length;i++){ try{ if(a[i].del)await del(G_DATA,a[i].k); else await put(G_DATA,a[i].k,a[i].v);}catch(e){left.push(a[i]);} }
  setPend(left);
}
async function send(k,v,isDel){
  var item={k:k,v:v,del:!!isDel,sid:sid,cls:cid};
  try{ if(isDel)await del(G_DATA,k); else await put(G_DATA,k,v); connected=true; return true; }
  catch(e){ addPend(item); connected=false; return false; }
}

    '<div class="panel"><h3>선생님의 취재 팁</h3><p class="sub">아이들이 노트 오른쪽 위 <b>선생님의 취재 팁</b>을 누르면 보이는 글이에요. 줄을 바꾸면 그대로 보여요.</p>'+
    [['general','공통 안내'],['use','① 카드 예시'],['life','② 카드 예시'],['line','③ 한 줄 예시'],['cmp','비교하기 예시']].map(function(x){
      return '<label class="f"><span>'+x[1]+'</span><textarea data-k="cfg:tips.'+x[0]+'" data-set="text" style="min-height:90px">'+esc((cfg.tips||{})[x[0]]||'')+'</textarea></label>';}).join('')+'</div>';
  html+='<div class="row" style="position:sticky;bottom:12px;justify-content:flex-end"><span class="why">'+(cfgDirty?'저장하지 않은 바뀐 내용이 있어요.':'')+'</span><button class="btn" data-a="csave">설정 저장</button></div></div>';
  return html;
}

/* ── 버튼 켜고 끄기 ── */
function syncBtn(el){
  var k=el.dataset.k, ok=el.value.trim().length>0, A=document.getElementById('app');
  if(k.indexOf('f:')===0){
    var p=k.split(':'), key=p[1]+':'+p[2], b=A.querySelector('[data-a="add"][data-v="'+key+'"]');
    var any=!!readFields('f:'+key+':');
    if(b)b.disabled=!any||saving['new:'+key];
    var wy=A.querySelector('[data-why="new:'+key+'"]'); if(wy)wy.textContent=any?'':'한 칸이라도 채우면 올릴 수 있어요.';
    return;
  }
  var frame=null, btn=null;
  if(k.indexOf('new:')===0){btn=A.querySelector('[data-a="add"][data-v="'+k.slice(4)+'"]');}
  else if(k.indexOf('line:')===0){btn=A.querySelector('[data-a="line"][data-v="'+k.slice(5)+'"]');}
  else return;
  var fb=A.querySelector('[data-a="frame"][data-v="'+k+'"]'); if(fb)frame=fb.dataset.f;
  var unfilled=frame&&el.value.trim()===frame.trim();
  if(btn)btn.disabled=!ok||unfilled||saving[k];
  var why=A.querySelector('[data-why="'+k+'"]');
  if(why)why.textContent=!ok?'글을 쓰면 올릴 수 있어요.':unfilled?'괄호 안을 채워 주세요.':'';
}
document.addEventListener('input',function(e){
  var el=e.target; if(!el.dataset)return;
  if(el.tagName==='TEXTAREA'||(el.dataset.k&&el.dataset.k.indexOf('f:')===0))syncBtn(el);
  if(view.s==='teacher'&&el.dataset.set==='text')cfgDirty=true;
});
document.addEventListener('change',function(e){
  var el=e.target; if(!el.dataset||view.s!=='teacher')return;
  var k=klass(tTab);
  if(el.dataset.set==='g'){var p=el.dataset.k.split(':');var s=stu(+p[1],+p[2]);if(s){s.g=+el.value;cfgDirty=true;}}
  if(el.dataset.set==='groups'&&k){k.groups=+el.value;cfgDirty=true;render();}
});

/* ── 누르기 ── */
document.addEventListener('click',async function(e){
  var b=e.target.closest('[data-a]'); if(!b)return;
  var a=b.dataset.a, v=b.dataset.v, A=document.getElementById('app');
  if(a==='cls'){cid=+v;sid=null;rememberMe();try{await loadData(cid);}catch(err){}go('who');}
  else if(a==='back-cls'){cid=null;sid=null;rememberMe();go('cls');}
  else if(a==='who'){sid=+v;rememberMe();overlayPending();var fs=firstOpenSheet();go('note',{sheet:fs,slot:firstOpenSlot(fs)});}
  else if(a==='back-who'){sid=null;rememberMe();try{await loadData(cid);}catch(err){}go('who');}
  else if(a==='sheet'){go('note',{sheet:v,slot:firstOpenSlot(v)});}
  else if(a==='slot'){view.slot=v;ui.edit=null;ui.del=null;render();}
  else if(a==='cslot'){view.cslot=v;ui.edit=null;ui.del=null;render();}
  else if(a==='cmp'){go('cmp');}
  else if(a==='kind'){var ks=(ui.kind[b.dataset.slot]||[]).slice(),ix=ks.indexOf(v);if(ix>=0)ks.splice(ix,1);else ks.push(v);ui.kind[b.dataset.slot]=ks;render();}
  else if(a==='frame'){var ta=A.querySelector('[data-k="'+v+'"]');if(ta){if(!ta.value.trim())ta.value=b.dataset.f;ta.focus();var i=ta.value.indexOf('(');if(i>=0)try{ta.setSelectionRange(i+1,i+1);}catch(err){}syncBtn(ta);}}
  else if(a==='add'){await addCard(v);}
  else if(a==='line'){await saveLine(v);}
  else if(a==='tip'){ui.tip=true;ui.links=false;render();}
  else if(a==='links'){ui.links=true;ui.tip=false;render();}
  else if(a==='links-close'){ if(e.target.closest('[data-stop]')&&b.classList.contains('modal'))return; ui.links=false;render();}
  else if(a==='tip-close'){ if(e.target.closest('[data-stop]')&&b.classList.contains('modal'))return; ui.tip=false;render();}
  else if(a==='edit'){ui.edit=v;ui.del=null;render();}
  else if(a==='edit-cancel'){ui.edit=null;render();}
  else if(a==='edit-save'){var t=A.querySelector('[data-k="edit:'+v+'"]'), ef=readFields('ef|'+v+'|');
    if(ef){var c0=Object.assign({},cards[v],{f:ef,t:composeT(ef),at2:Date.now()});delete c0._local;cards[v]=c0;ui.edit=null;var ok0=await send(v,c0);if(!ok0)overlayPending();render();}
    else if(t&&t.value.trim()){var c=Object.assign({},cards[v],{t:t.value.trim(),at2:Date.now()});delete c._local;cards[v]=c;ui.edit=null;var ok=await send(v,c);if(!ok)overlayPending();render();}}
  else if(a==='del'){ui.del=v;render();}
  else if(a==='del-no'){ui.del=null;render();}
  else if(a==='del-yes'){delete cards[v];ui.del=null;await send(v,null,true);render();}
  /* 선생님 */
  else if(a==='pin'){ if(v==='←')typed=typed.slice(0,-1); else if(typed.length<4)typed+=v; wrong=false;
    if(typed.length===4){ if(typed===String(cfg.pin)){unlocked=true;try{sessionStorage.setItem('rn-teacher','1');}catch(err){} typed='';try{await loadData(tTab);}catch(err){} } else {wrong=true;typed='';} }
    render(); }
  else if(a==='leave'){go(cid?(sid?'note':'who'):'cls');}
  else if(a==='lock'){unlocked=false;try{sessionStorage.removeItem('rn-teacher');}catch(err){}go(cid?'who':'cls');}
  else if(a==='ttab'){if(cfgDirty){say('저장하지 않은 설정이 있어요. 먼저 설정 저장을 눌러 주세요.',1);return;}tTab=+v;ui.del=null;try{await loadData(tTab);}catch(err){}render();}
  else if(a==='tsheet'){tSheet=v;render();}
  else if(a==='big'){big=!big;render();}
  else if(a==='tdel'){ if(ui.del!==v){ui.del=v;render();return;} delete cards[v];ui.del=null;await send(v,null,true);render(); }
  else if(a==='open'){ var k=klass(tTab); var i2=k.open.indexOf(v); if(i2>=0)k.open.splice(i2,1); else k.open.push(v);
    render(); try{ var saved=clone(cfg); await saveCfgOpen(k.id,k.open); say(k.name+': 열린 칸을 바꿨어요.'); }catch(err){ say('열린 칸을 저장하지 못했어요. '+err.message,1); } }
  else if(a==='import'){ await importRoster(); }
  else if(a==='csave'){ await saveSettings(); }
});
function firstOpenSheet(){ return isOpen('now:use')||isOpen('now:life')||isOpen('now:line')?(isOpen('past:use')||isOpen('past:life')||isOpen('past:line')?'past':'now'):'past'; }

/* 열린 칸만 저장: 다른 설정을 덮어쓰지 않도록 서버의 최신 설정에 열린 칸만 바꿔 넣음 */
async function saveCfgOpen(classId,open){
  var r=await api('entries?select=value&group_id=eq.'+G_CFG+'&key=eq.'+CKEY); var rows=r.ok?await r.json():[];
  var base=rows.length&&rows[0].value?merge(DEFAULT,rows[0].value):clone(cfg);
  base.classes.forEach(function(c){if(c.id===classId)c.open=open.slice();});
  await put(G_CFG,CKEY,base);
  var mine=klass(classId); if(mine)mine.open=open.slice();
}
async function addCard(key){
  var A=document.getElementById('app'), p=key.split(':'), s=me(); if(!s)return;
  var ta=A.querySelector('[data-k="new:'+key+'"]'), f=null, t='';
  if(ta){t=ta.value.trim();} else {f=readFields('f:'+key+':'); if(f)t=composeT(f);}
  if(!t)return;
  var k='c:'+cid+':'+s.g+':'+p[0]+':'+p[1]+':'+newId();
  var v={t:t,by:sid,name:s.name,at:Date.now(),kinds:p[1]==='use'&&p[0]!=='cmp'?(ui.kind[key]||[]).slice():[]};
  if(f)v.f=f;
  saving['new:'+key]=1;
  cards[k]=v; if(ta)ta.value=''; else W5ORDER.forEach(function(x){var el=A.querySelector('[data-k="f:'+key+':'+x+'"]');if(el)el.value='';});
  ui.kind[key]=[]; if(document.activeElement)document.activeElement.blur();
  var ok=await send(k,v); delete saving['new:'+key];
  if(!ok)cards[k]=Object.assign({},v,{_local:1});
  ui.flash={key:key,at:Date.now(),local:!ok}; render();
  setTimeout(function(){if(!busy())render();},4200);
}
async function saveLine(sheet){
  var A=document.getElementById('app'), ta=A.querySelector('[data-k="line:'+sheet+'"]'); if(!ta)return;
  var t=ta.value.trim(); if(!t)return; var s=me();
  var k='l:'+cid+':'+sid+':'+sheet, v={t:t,name:s.name,g:s.g,at:Date.now()};
  saving['line:'+sheet]=1; syncBtn(ta);
  lines[k]=v; var ok=await send(k,v); delete saving['line:'+sheet];
  if(!ok)lines[k]=Object.assign({},v,{_local:1});
  ui.flash={key:sheet+':line',at:Date.now(),local:!ok}; ta.blur(); render();
  setTimeout(function(){if(!busy())render();},4200);
}
async function importRoster(){
  try{
    var r=await api('entries?select=value&group_id=eq.'+G_REFLECT+'&key=eq.cfg2'); if(!r.ok)throw new Error('HTTP '+r.status);
    var rows=await r.json(); if(!rows.length||!rows[0].value)throw new Error('성찰 앱 명단을 찾지 못했어요');
    var src=rows[0].value.classes||[], n=0;
    cfg.classes.forEach(function(c){
      var sc=src.filter(function(x){return x.id===c.id;})[0]; if(!sc)return;
      var old=c.students;
      c.students=(sc.students||[]).map(function(s){
        var hit=old.filter(function(o){return o.name===s.name;})[0];
        n++; return {id:s.id,name:s.name,g:hit?hit.g:0};
      });
    });
    cfgDirty=true; say('명단 '+n+'명을 불러왔어요. 모둠 번호를 고른 뒤 설정 저장을 눌러 주세요.'); render();
  }catch(err){ say('명단을 불러오지 못했어요. '+err.message,1); }
}
async function saveSettings(){
  var A=document.getElementById('app');
  A.querySelectorAll('[data-set="text"]').forEach(function(el){
    var path=el.dataset.k.slice(4).split('.'), v=el.value.trim();
    if(path[0]==='pin'){var p=v.replace(/\D/g,'').slice(0,4);if(p.length===4)cfg.pin=p;return;}
    if(!v&&!(path[0]==='cmp'&&path[2]==='frame'))return;
    var o=cfg; for(var i=0;i<path.length-1;i++)o=o[path[i]]; o[path[path.length-1]]=v;
  });
  try{
    /* 열린 칸은 서버의 최신 상태를 따름 */
    var r=await api('entries?select=value&group_id=eq.'+G_CFG+'&key=eq.'+CKEY); var rows=r.ok?await r.json():[];
    if(rows.length&&rows[0].value&&rows[0].value.classes)rows[0].value.classes.forEach(function(sc){var c=klass(sc.id);if(c&&sc.open)c.open=sc.open;});
    await saveCfg(); cfgDirty=false; say('설정을 저장했어요.');
  }catch(err){ say('설정을 저장하지 못했어요. '+err.message,1); }
  render();
}

/* 숨은 입구 — 제목을 1초쯤 누르고 있기 */
(function(){
  var T=document.getElementById('title'), t=null;
  function open(){ if(view.s==='teacher')return; typed='';wrong=false; tTab=cid||cfg.classes[0].id; go('teacher'); loadData(tTab).then(render).catch(function(){}); }
  T.addEventListener('pointerdown',function(){clearTimeout(t);t=setTimeout(open,900);});
  ['pointerup','pointerleave','pointercancel'].forEach(function(ev){T.addEventListener(ev,function(){clearTimeout(t);});});
  T.addEventListener('contextmenu',function(e){e.preventDefault();});
})();

/* ── 시작 ── */
(async function(){
  try{ await loadCfg(); }catch(e){ say('서버에 연결하지 못했어요. 쓴 글이 이 기기에만 남을 수 있어요.',1); }
  if(/[?&]start=1/.test(location.search)){ try{sessionStorage.removeItem('rn-me');}catch(e){} }
  else { try{ var m=JSON.parse(sessionStorage.getItem('rn-me')||'null'); if(m&&klass(m.c)){cid=m.c; if(stu(m.c,m.s))sid=m.s;} }catch(e){} }
  try{ await flush(); if(cid)await loadData(cid); }catch(e){}
  loaded=true;
  if(/[?&]t=1/.test(location.search)){ tTab=cid||cfg.classes[0].id; try{await loadData(tTab);}catch(e){} go('teacher'); }
  else { var fs0=firstOpenSheet(); go(cid?(sid?'note':'who'):'cls', sid?{sheet:fs0,slot:firstOpenSlot(fs0)}:null); }
  setInterval(async function(){
    if(document.hidden||busy()||ui.edit)return;
    if(view.s==='teacher'&&cfgDirty)return;
    if(view.s==='lock')return;
    try{
      await flush();
      await loadCfg();
      var c=view.s==='teacher'?tTab:cid;
      if(c)await loadData(c);
      if(!busy()&&!ui.edit&&!(view.s==='teacher'&&cfgDirty))render();
    }catch(e){ connected=false; if(!busy())render(); }
  },5000);
})();
</script>
