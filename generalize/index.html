<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>생각 잇기 · 일반화 탐구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#E9E4DA; --paper:#FBF8F1; --rule:#E3DCCB; --ink:#2B2A27; --soft:#5C564E;
  --open:#D9622B; --ok:#3E7D4E; --bad:#B23A2E;
  --s1:#B88A10; --s1bg:#FFF4D2;   /* 예상하기 */
  --s2:#2F6E99; --s2bg:#E6F1F8;   /* 따져 보기 */
  --s3:#C2531F; --s3bg:#FBE6DB;   /* 결론 내리기 */
  --space:#5C8A4B; --time:#8C5A3C;
  --hand:'Nanum Pen Script',cursive;
  --body:'Gowun Dodum',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--desk);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65;padding:0 16px 80px;overflow-wrap:anywhere}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
button:disabled{cursor:not-allowed;opacity:.5}
input,textarea{font-family:inherit;font-size:17px;color:var(--ink)}
:focus-visible{outline:2.5px solid var(--s2);outline-offset:2px;border-radius:4px}
.wrap{max-width:760px;margin:0 auto}
.wide{max-width:1280px;margin:0 auto}
header.top{max-width:1280px;margin:0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:16px 0 8px}
#title{font-family:var(--hand);font-size:36px;line-height:1;margin:0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#state{font-size:15px;color:var(--soft);text-align:right}
#state b{color:var(--ink)}
.msg{max-width:1280px;margin:6px auto;padding:10px 14px;border-radius:10px;background:#E4F0E6;color:var(--ok);font-size:15px}
.msg.bad{background:#F7E1DD;color:var(--bad)}
.page{background:var(--paper);border-radius:6px 14px 14px 6px;padding:20px 22px 24px 48px;border-left:10px solid #CDBF9F;
  box-shadow:0 1px 0 #d8d0bf,0 10px 24px -14px rgba(60,50,30,.35);
  background-image:linear-gradient(to right,transparent 0 30px,#E9B4A8 30px 31.5px,transparent 31.5px)}
h2.hand{font-family:var(--hand);font-size:40px;font-weight:400;margin:0 0 6px;line-height:1.1}
.sub{color:var(--soft);font-size:16px;margin:0 0 14px}
.center{text-align:center}
.pick{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,240px));justify-content:center;gap:14px;margin-top:18px}
.pick button{background:#fff;border:2px solid #CFC6B3;border-radius:12px;padding:18px 12px;font-size:24px;min-height:84px;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.pick button:active{transform:translateY(2px)}
.pick button span{display:block;font-size:14px;color:var(--soft);margin-top:2px}
.btn{background:var(--ink);color:#FBF8F1;border:2px solid var(--ink);border-radius:10px;padding:10px 20px;font-size:17px;min-height:48px}
.btn.ghost{background:#fff;color:var(--ink);border-color:#CFC6B3}
.btn.sm{padding:6px 12px;min-height:38px;font-size:15px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.why{font-size:15px;color:var(--soft)}
.saved{color:var(--ok);font-size:15px}
.local-note{color:var(--bad);font-size:15px}
.empty{color:var(--soft);font-size:15px}
.lk{font-size:14px;text-decoration:underline;color:var(--soft);padding:4px 2px}

/* 단계 띠 */
.steps{display:flex;gap:6px;margin:4px 0 12px;flex-wrap:wrap;align-items:center}
.steps button{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;border:2px solid #CFC6B3;background:#fff;font-size:17px;min-height:46px}
.steps button .no{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#E3DCCB;font-size:14px}
.steps button.on{color:#fff}
.steps button.s1.on{background:var(--s1);border-color:var(--s1)} .steps button.s2.on{background:var(--s2);border-color:var(--s2)} .steps button.s3.on{background:var(--s3);border-color:var(--s3)}
.steps button.on .no{background:rgba(255,255,255,.3)}
.steps button.lock{opacity:.45}
.steps button .star{color:#E0A400}
.steps button.res{border-style:dashed}
.steps button.res.on{background:var(--ink);border-color:var(--ink);border-style:solid}

/* 탐구 화면 */
.main{display:grid;grid-template-columns:1fr;gap:16px}
@media (orientation:landscape) and (min-width:900px){ .main{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start} .col-r{position:sticky;top:10px} }
.subs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.subs{grid-template-columns:1fr}}
.subcard{border-radius:12px;padding:10px 14px;background:#fff;border:2px solid #E3DCCB}
.subcard h4{margin:0 0 2px;font-family:var(--hand);font-size:26px;font-weight:400}
.subcard.space h4{color:var(--space)} .subcard.time h4{color:var(--time)}
.subcard p{margin:0;font-size:15.5px;line-height:1.5;word-break:keep-all}
.subcard h4{font-size:22px!important}
.bub.first{border:1.5px dashed #CFC6B3;background:#FBF8F1}

.chat{margin-top:14px;background:#fff;border:2px solid #E3DCCB;border-radius:14px;display:flex;flex-direction:column;min-height:360px}
.chat .head{padding:10px 14px;border-bottom:1.5px solid #EFE9DC;display:flex;justify-content:space-between;align-items:center;gap:8px}
.chat .head b{font-family:var(--hand);font-size:26px;font-weight:400}
.log{flex:1;overflow-y:auto;max-height:max(320px,calc(100vh - 360px));padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:88%;padding:9px 13px;border-radius:14px;line-height:1.55;word-break:keep-all;font-size:17px}
.bub.ai{align-self:flex-start;background:#F3EFE6;border-bottom-left-radius:4px}
.bub.me{align-self:flex-end;background:var(--s2bg);border-bottom-right-radius:4px}
.bub.pass{background:#E7F3E9;border:2px solid var(--ok)}
.bub .who{display:block;font-size:13px;color:var(--soft);margin-bottom:1px}
.sep{align-self:center;font-size:13px;color:var(--soft);background:#F3EFE6;border-radius:999px;padding:2px 12px}
.think{align-self:flex-start;color:var(--soft);font-size:15px}
.think i{display:inline-block;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.think i{animation:none}}
.compose{border-top:1.5px solid #EFE9DC;padding:10px 12px;display:flex;gap:8px;align-items:flex-end}
.compose textarea{flex:1;min-height:52px;max-height:140px;resize:vertical;border:1.5px solid #CFC6B3;border-radius:10px;padding:8px 10px;line-height:1.5}
.compose .btn{min-width:84px}
.retry{padding:6px 14px 10px;font-size:15px;color:var(--bad)}
.mission{display:flex;align-items:center;gap:10px;background:#E7F3E9;border:2px solid var(--ok);color:var(--ok);border-radius:12px;padding:8px 14px;margin:10px 0 0;font-size:17px}
.mission .big{font-size:26px;color:#E0A400}

.fields{border-radius:14px;padding:14px 16px;border:2px solid}
.fields.s1{background:var(--s1bg);border-color:#EBD58E} .fields.s2{background:var(--s2bg);border-color:#A9CBE2} .fields.s3{background:var(--s3bg);border-color:#EDB89C}
.fields h3{margin:0 0 4px;font-family:var(--hand);font-size:32px;font-weight:400;line-height:1.1}
.fields .desc{margin:0 0 10px;font-size:15.5px;color:var(--soft)}
.fld{margin-top:12px}
.fld label{display:block;font-weight:700;font-size:17px}
.fld .help{display:block;font-size:14.5px;color:var(--soft);margin:2px 0 4px;line-height:1.5}
.fld textarea{width:100%;min-height:72px;border:1.5px solid #CFC6B3;border-radius:10px;padding:8px 12px;line-height:1.6;background:#fff;resize:vertical}
.tip{background:rgba(255,255,255,.75);border-radius:8px;padding:6px 10px;margin:2px 0 6px;font-size:14.5px;line-height:1.55;word-break:keep-all}
.tip .tl{display:inline-block;font-size:12.5px;color:#fff;background:var(--soft);border-radius:999px;padding:0 8px;margin-right:2px}
.tip .tf{display:block;margin-top:3px;color:var(--ink)}
.checks{background:rgba(255,255,255,.7);border-radius:10px;padding:8px 12px;margin:0 0 6px}
.checks b{font-size:15.5px}
.checks ul{margin:4px 0 0;padding-left:0;list-style:none}
.checks li{font-size:15px;padding-left:24px;position:relative;line-height:1.5;margin:2px 0}
.checks li::before{content:'';position:absolute;left:2px;top:4px;width:14px;height:14px;border:2px solid var(--soft);border-radius:4px}
.checks li.done::before{background:var(--ok);border-color:var(--ok)}
.checks li.done::after{content:'';position:absolute;left:7px;top:6px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.exbox{background:#fff;border:1.5px dashed #CFC6B3;border-radius:10px;padding:8px 12px;margin:6px 0 4px}
.exbox p{margin:3px 0;font-size:15px;line-height:1.55;word-break:keep-all}
.exbox b{display:inline-block;color:var(--soft);font-weight:400;margin-right:4px}
.frame{font-size:15px;background:#fff;border:1.5px dashed var(--s3);border-radius:8px;padding:6px 10px;margin:4px 0 6px}
.closed{background:#fff;border-radius:14px;padding:26px;text-align:center;color:var(--soft)}

/* 결론 카드 */
.result{background:#fff;border-radius:16px;padding:22px 26px;border:3px solid var(--s3)}
.result h3{margin:0 0 8px;font-family:var(--hand);font-size:32px;font-weight:400;color:var(--s3)}
.result .fin{font-size:24px;line-height:1.6;font-weight:700;margin:0 0 12px;word-break:keep-all}
.result .ev{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:18px}
.result .ev b{color:var(--soft);font-weight:400;white-space:nowrap}

/* 선생님 */
.panel{background:#fff;border-radius:14px;padding:16px 18px;margin-top:14px;box-shadow:0 1px 0 #d8d0bf}
.panel h3{margin:0 0 6px;font-size:20px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tabs button{padding:8px 16px;border-radius:10px;border:2px solid #CFC6B3;background:#fff;min-height:44px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs .sp{flex:1}
.tog{padding:8px 14px;border-radius:10px;border:2px solid #CFC6B3;background:#fff;min-height:42px;font-size:15px}
.tog.on{background:var(--open);border-color:var(--open);color:#fff}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th,.tbl td{border-bottom:1px solid #E3DCCB;padding:8px 6px;text-align:left;vertical-align:top}
.tbl th{font-weight:400;color:var(--soft);font-size:14px}
.tbl td.g{font-weight:700;white-space:nowrap}
.tbl .k{display:block;font-size:12.5px;color:var(--soft)}
.tbl .v{display:block;margin-bottom:6px;word-break:keep-all}
.star{color:#E0A400}
.set label{display:block;margin-top:10px;font-size:14px;color:var(--soft)}
.set input,.set textarea{width:100%;border:1.5px solid #CFC6B3;border-radius:8px;padding:7px 10px;font-size:16px;background:#FFFDF8}
.set textarea{min-height:60px;line-height:1.5}
.set .stg{border-top:1.5px dashed #E3DCCB;margin-top:14px;padding-top:6px}
.dlog{max-height:60vh;overflow:auto;border:1.5px solid #E3DCCB;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;background:#FFFDF8}
.lockbox{max-width:340px;margin:30px auto;text-align:center}
.dots{font-size:30px;letter-spacing:10px;margin:10px 0}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{background:#fff;border:2px solid #CFC6B3;border-radius:10px;font-size:24px;min-height:60px}

/* 발표 화면 */
body.presenting{background:#1F1D1A;padding:0}
body.presenting header.top,body.presenting #msg{display:none}
.present{height:100vh;display:flex;flex-direction:column;padding:2vh 2.5vw;gap:2vh;overflow:hidden}
.ptop{display:flex;align-items:center;gap:12px}
.ptop h2{flex:1;margin:0;color:#FBF8F1;font-family:var(--hand);font-weight:400;font-size:min(3vw,5vh)}
.pgrid{flex:1;min-height:0;overflow:hidden;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:2vh 1.6vw;align-content:safe center}
.pcard{background:#FBF8F1;border-radius:18px;padding:2.2vh 2vw;font-size:var(--fs)}
.pcard h4{margin:0 0 .25em;font-family:var(--hand);font-weight:400;font-size:.85em;color:var(--s3)}
.pcard .fin{font-weight:700;line-height:1.5;margin:0 0 .4em;word-break:keep-all}
.pcard .ev{font-size:.72em;line-height:1.5;margin:0;color:#3a3833;word-break:keep-all}
.pcard .ev b{color:var(--s3);font-weight:400}
.pempty{color:#FBF8F1;font-size:min(2.4vw,4vh);text-align:center;opacity:.8}
.pbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pbtn{font-size:16px;background:rgba(251,248,241,.12);color:#FBF8F1;border:1.5px solid rgba(251,248,241,.4);border-radius:10px;padding:8px 14px;min-height:44px}
.pbtn.on{background:var(--open);border-color:var(--open)}
</style>
</head>
<body>
<header class="top">
  <h1 id="title">생각 잇기</h1>
  <span id="state"></span>
</header>
<div id="msg"></div>
<main id="app"></main>

<script src="config.js?v=1"></script>
<script>
/* ────────────────────────────────────────────────────────────────
   저장 (취재 노트와 같은 entries 표, 새 SQL 없음)
     921 / 'cfg'                  이 앱 설정
     920 / 'k:<반>:<모둠>:<단계>'   모둠이 남긴 칸 {f:{칸:글}, at}
     920 / 'm:<반>:<모둠>:<번호>'   챗봇 대화(중계 함수가 저장)
     911 / 'cfg'                  취재 노트 설정(반 이름, 모둠 편성) — 읽기만
   ──────────────────────────────────────────────────────────────── */
var C=window.GEN_CFG||{}, G_DATA=920, G_CFG=921, G_NOTE=911;
var DEFAULT={
  pin:'1234',
  subs:{
    space:'사람들이 사는 공간(자연환경 및 인문환경)의 특징에 따라 서로 다른 생활 모습으로 변화한다.',
    time:'사람들이 환경을 이용하는 방식이 달라지면, 시간의 흐름에 따라 사람들의 생활 모습도 변화한다.'
  },
  stages:[
    {name:'예상하기',desc:'두 문장에서 같은 점을 찾고, 둘을 하나로 이어 "아마 이럴 거야" 하는 예상 문장을 만들어요.',
     question:'두 문장을 모둠이 함께 소리 내어 읽어 봐요. 두 문장이 똑같이 말하고 있는 것은 무엇인가요?',
     fields:[{k:'same',label:'두 문장의 같은 점',help:'두 문장이 똑같이 말하는 것을 한 가지 적어요.'},
             {k:'guess',label:'우리 모둠 예상 문장',help:'예상 문장은 "아마 이럴 거야" 하고 우리가 짐작해 보는 문장이에요. 아직 맞는지 모르니까, 다음 단계에서 증거로 따져 봐요.'}]},
    {name:'따져 보기',desc:'우리 조사에서 예상 문장이 맞다는 증거를 찾고, 아닐 수도 있는 경우도 생각해요.',
     question:'우리 모둠의 예상 문장이 맞다는 걸 보여 주는 우리 조사 내용이 있나요? 문경의 옛날과 지금, 다른 고장의 모습을 떠올려 봐요.',
     fields:[{k:'proof',label:'예상 문장을 뒷받침하는 증거',help:'우리가 조사한 실제 이야기에서 찾아요. 어디의, 언제 이야기인지 적어요.'},
             {k:'other',label:'아닐 수도 있는 경우',help:'예상과 다른 경우나, 다른 까닭으로 생활이 바뀐 경우가 있을까요?'}]},
    {name:'결론 내리기',desc:'예상 문장을 다듬어 누구에게나 맞는 최종 결론 한 문장을 만들고, 증거 두 개를 골라요.',
     question:'예상 문장을 다듬어서, 어느 곳에 사는 누구에게나 맞는 한 문장으로 만들어 봐요. 어떤 말을 바꾸면 더 넓게 말할 수 있을까요?',
     fields:[{k:'final',label:'최종 결론',help:'우리 모둠이 다듬은 한 문장이에요.'},
             {k:'ev1',label:'증거 1',help:'결론이 맞다는 것을 보여 주는 우리 조사 내용 하나'},
             {k:'ev2',label:'증거 2',help:'또 다른 증거 하나. 증거 1과 다른 이야기(다른 곳이나 다른 때)면 더 좋아요.'}]}
  ],
  frame:'우리가 살고 있는 (        )과 (        )은 우리가 살아가는 (        )을 변화시킨다.',
  passText:'미션 성공이에요! 오른쪽 칸에 우리 모둠 생각을 정리해 남기고, 선생님이 다음 단계를 열어 줄 때까지 모둠끼리 한 번 더 이야기해 봐요.',
  classes:[]
};
var cfg=clone(DEFAULT), note={classes:[]}, data={}, connected=false;
var cid=null, gid=null, view={s:'cls'}, ui={dirty:{},flash:null,tab:null,chat:{},log:null,clr:null};
var unlocked=false, typed='', wrong=false, tTab=null, cfgDirty=false;
try{unlocked=sessionStorage.getItem('gz-teacher')==='1';}catch(e){}

function clone(o){return JSON.parse(JSON.stringify(o));}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function br(s){return esc(s).replace(/\n/g,'<br>');}
function say(t,bad){document.getElementById('msg').innerHTML=t?'<p class="msg'+(bad?' bad':'')+'">'+esc(t)+'</p>':'';}
function merge(a,b){var o=clone(a);Object.keys(b||{}).forEach(function(k){
  if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))o[k]=merge(a[k],b[k]); else o[k]=b[k];});return o;}

/* ── 서버 ── */
function api(p,o){o=o||{};var h=Object.assign({'apikey':C.key,'Authorization':'Bearer '+C.key,'Content-Type':'application/json'},o.headers||{});
  return fetch(String(C.url||'').replace(/\/$/,'')+'/rest/v1/'+p,Object.assign({},o,{headers:h}));}
async function put(g,k,v){
  var r=await api('entries?on_conflict=group_id,key',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},
    body:JSON.stringify([{group_id:g,key:k,value:v,updated_at:new Date().toISOString()}])});
  if(!r.ok)throw new Error('HTTP '+r.status);
}
async function del(g,k){var r=await api('entries?group_id=eq.'+g+'&key=eq.'+encodeURIComponent(k),{method:'DELETE',headers:{'Prefer':'return=minimal'}});if(!r.ok)throw new Error('HTTP '+r.status);}

/* 챗봇 보내기 */
async function sendChat(text){
  var c=ui.chat; c.err=''; c.wait=text; c.text=text; render();
  var tries=0;
  while(true){
    try{
      var r=await fetch(C.fn,{method:'POST',headers:{'Content-Type':'application/json','apikey':C.key,'Authorization':'Bearer '+C.key},body:JSON.stringify({cls:cid,g:gid,text:text})});
      var j={}; try{j=await r.json();}catch(e){}
      if(r.ok&&j.ok){ data[j.key]=j.value; c.wait=''; c.text=''; c.err=''; var ta=document.querySelector('[data-k="chat"]'); if(ta)ta.value=''; render(); return; }
      if(j.error==='busy'&&tries<3){tries++; await new Promise(function(res){setTimeout(res,6000);}); continue;}
      c.err={closed:'선생님이 챗봇을 닫았어요.',rate:'조금 천천히 보내요. 잠깐 뒤에 다시 보내기를 눌러요.',limit:'오늘 보낼 수 있는 만큼 다 보냈어요. 선생님께 말씀드려요.',
        roster:'이 모둠은 명단에 없어요. 선생님께 말씀드려요.',bad:'글이 너무 길거나 비어 있어요. 200자 안으로 써요.',busy:'AI가 바빠요. 잠깐 뒤에 다시 보내기를 눌러요.'}[j.error]||
        (r.status===404?'지금은 AI를 쓸 수 없어요. 오른쪽 칸은 그대로 쓸 수 있어요.':'AI가 대답하지 못했어요. 다시 보내기를 눌러요.');
    }catch(e){ c.err='지금은 AI에 연결할 수 없어요. 인터넷을 확인하고 다시 보내기를 눌러요. 오른쪽 칸은 그대로 쓸 수 있어요.'; }
    c.wait=''; render();
    var ta2=document.querySelector('[data-k="chat"]'); if(ta2&&!ta2.value)ta2.value=text; syncSave();
    try{await loadData(cid,gid);render();}catch(e){}
    return;
  }
}
async function saveFields(i){
  var st=stage(i), f={}, A=document.getElementById('app');
  st.fields.forEach(function(x){var el=A.querySelector('[data-k="f:'+i+':'+x.k+'"]');f[x.k]=el?el.value.trim():'';});
  var key='k:'+cid+':'+gid+':'+i, v={f:f,at:Date.now()}, ok=true;
  data[key]=v;

}

(async function(){
  try{await loadCfg();}catch(e){say('서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.',1);}
  if(/[?&]start=1/.test(location.search)){try{sessionStorage.removeItem('gz-me');}catch(e){}}
  else{try{var m=JSON.parse(sessionStorage.getItem('gz-me')||'null');if(m&&nclass(m.c)){cid=m.c;if(m.g&&groupsOf(m.c).indexOf(m.g)>=0)gid=m.g;}}catch(e){}}
  if(/[?&]t=1/.test(location.search)){tTab=cid||((note.classes||[])[0]||{}).id;try{await loadData(tTab);}catch(e){}go('teacher');}
  else{if(cid&&gid){try{await loadData(cid,gid);}catch(e){}go('main');}else go(cid?'grp':'cls');}
  setInterval(async function(){
    if(document.hidden||busy()||ui.chat.wait)return;
    if(view.s==='teacher'&&cfgDirty)return;
    if(view.s==='lock')return;
    try{
      await flush(); await loadCfg();
      var tv=view.s==='teacher'||view.s==='present';
      if(tv&&tTab)await loadData(tTab); else if(cid&&gid)await loadData(cid,gid);
      if(!busy()&&!ui.chat.wait&&!(view.s==='teacher'&&cfgDirty))render();
    }catch(e){connected=false;if(!busy())render();}
  },5000);
})();
</script>
</body>
</html>
